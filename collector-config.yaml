service:
  # PAYLOAD-PARITY INVARIANT (OTL-1): exactly ONE pipeline per signal type.
  # Fan out by appending exporters to the existing pipeline (after the shared
  # processors) so every destination receives the identical post-transform
  # payload. Never add a parallel per-vendor pipeline (logs/xxx, metrics/xxx).
  #
  # ---------------------------------------------------------------------------
  # PER-DESTINATION FORWARDING (OTL-25 §2) — which signal goes where.
  # The collector has no "user flag" primitive beyond a pipeline's `exporters:`
  # list, so routing IS that list. To send a signal to a destination, add its
  # exporter id to the pipeline below (and uncomment the env-gated exporter
  # block above + set its env vars). Defaults:
  #
  #   signal   | destination(s)                      | change via
  #   ---------|-------------------------------------|-------------------------
  #   metrics  | prometheus (+ honeycomb, dash0)     | metrics.exporters list
  #   logs     | otlp_http=Loki (+ honeycomb, dash0) | logs.exporters list
  #   traces   | otlp/tempo  ONLY                    | traces.exporters list
  #
  # TRACES ROUTE TO TEMPO ONLY, BY DESIGN — do NOT add other trace destinations:
  #   * Loki cannot ingest traces (404s -> retries/drops).
  #   * Honeycomb & Dash0 bill PER SPAN, and traces are far higher volume than
  #     logs/metrics, so a trace fan-out balloons cost. Enable a vendor trace
  #     leg only deliberately, and only AFTER tail_sampling (already wired into
  #     the traces pipeline) trims volume — never with an empty/env-driven
  #     endpoint (that crash-loops the collector at boot).
  # The vendor env-gated legs (honeycomb/dash0) stay on metrics + logs only.
  # ---------------------------------------------------------------------------
  pipelines:
    metrics:
      # OTL-20: the count + signal_to_metrics connectors feed catalyst-derived
      # metrics into this one metrics pipeline (no parallel pipeline — invariant).
      # deltatocumulative converts the count connector's Delta sums to Cumulative;
      # resource/strip_connector_iid drops the connector's per-run instance id.
      receivers: [otlp, count, signal_to_metrics]
      processors: [deltatocumulative, transform/connector_metric_fixup, resource, resource/strip_connector_iid]
      # To fan metrics out to Honeycomb/Dash0 as well, append the SAME exporter
      # ids here once their blocks are uncommented, e.g.:
      #
      #   exporters: [prometheus, debug, otlp_http/honeycomb, otlp_http/dash0]
      #
      # (One exporter definition can serve both pipelines.)
      exporters: [prometheus, debug, otlp_http/honeycomb, otlp_http/dash0]
    
    logs:
      receivers: [otlp]
      # OTL-20: transform/metrics_normalize runs AFTER transform/logs so the
      # logs->metrics connectors (exporters below) see underscore-form keys.
      processors: [resource, transform/logs, transform/metrics_normalize, transform/scheduler_health_promote]
      # otlp_http = Loki (OTL-8 rename). To turn on the CTL-812 fan-out:
      # (1) uncomment the matching exporter block above, (2) set the env vars in
      # docker-compose.yml, and (3) replace the line below with the "enable
      # fan-out" line. Keep otlp_http and debug; add the new ones:
      #
      #   exporters: [debug, otlp_http, otlp_http/honeycomb, otlp_http/dash0]
      #
      # (Enable only the destinations you have keys for — e.g. omit
      # otlp_http/dash0 if DASH0_* is unset, and leave its exporter block
      # commented so the empty endpoint can't fail validation.)
      #
      # OTL-20: count + signal_to_metrics are connector-exporters here — they
      # derive Prometheus metrics from these (post-transform) log records and
      # emit into the metrics pipeline above. They are derivation, not storage,
      # so the payload-parity invariant (identical payload to every STORAGE
      # destination) is unaffected.
      exporters: [debug, otlp_http, otlp_http/honeycomb, otlp_http/dash0, count, signal_to_metrics]

    traces:
      # OTL-25: spans -> Tempo ONLY (see the forwarding table above). NO
      # transform/logs here — that is a logs-only Loki-shaping step, wrong for
      # traces. `resource` stamps environment=production; `tail_sampling` keeps
      # slow ticks (>1s) + errors and samples the rest. One pipeline per signal
      # (OTL-1). Runs healthy-but-empty until the daemons emit spans (CTL-1330).
      receivers: [otlp]
      processors: [resource, tail_sampling]
      exporters: [otlp/tempo, debug]
