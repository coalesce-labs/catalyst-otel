receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add resource attributes for better analysis
  resource:
    attributes:
      - key: environment
        value: "production"
        action: insert

  # Copy resource attributes to log record attributes so they appear
  # as Loki structured metadata. Resource attributes from
  # OTEL_RESOURCE_ATTRIBUTES are not automatically promoted by Loki's
  # default config — only log record attributes become structured metadata.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # direnv resource attributes (set via use_otel_context in ~/.config/direnv/lib/otel.sh)
          - set(attributes["project"], resource.attributes["project"])
          - set(attributes["hostname"], resource.attributes["hostname"])
          # Canonical host identity (CTL-812): strip the macOS-appended ".local"
          # so every emitter (catalyst-agent, Claude Code, otel-forward, future
          # hosts) lands under ONE hostname label — a ".local" variant briefly
          # split one machine into two gauge series. Runs for ALL sources here
          # so no emitter can reintroduce the split.
          - replace_pattern(attributes["hostname"], "\\.local$", "")
          - set(attributes["branch"], resource.attributes["branch"])
          - set(attributes["linear_key"], resource.attributes["linear.key"])
          - set(attributes["catalyst_orchestration"], resource.attributes["catalyst.orchestration"])
          # Identity & environment
          - set(attributes["launcher_name"], resource.attributes["launcher.name"])
          - set(attributes["service_namespace"], resource.attributes["service.namespace"])
          - set(attributes["user"], resource.attributes["user"])
          # operator (OTL-51): WHO was at the keyboard. Distinct from the user.*
          # family, which Claude Code populates from the authenticated Anthropic
          # account — when an account is shared those are identical for everyone
          # and cannot separate two people. Deliberately NOT `user.name`: semconv
          # `user.*` means the authenticated principal, so `user.name` would
          # contradict `user_email` on the same series. Prometheus needs no
          # statement (resource_to_telemetry_conversion promotes any resource
          # attribute to a label); Loki does, because this transform is an
          # allowlist — and Loki is what session review reads. No-op under
          # error_mode: ignore when the attribute is unset.
          - set(attributes["operator"], resource.attributes["operator"])
          - set(attributes["resource_environment"], resource.attributes["environment"])
          # Session context
          - set(attributes["working_directory"], resource.attributes["working.directory"])
          - set(attributes["github_pr"], resource.attributes["github.pr"])
          # Catalyst orchestrator/worker context
          - set(attributes["catalyst_role"], resource.attributes["catalyst.role"])
          - set(attributes["catalyst_orchestrator"], resource.attributes["catalyst.orchestrator"])
          # CTL-760 session.context per-event attributes (OTL-2).
          # These are LOG RECORD attributes (numeric), not resource attributes — source is
          # attributes[...], not resource.attributes[...]. Rename dot-form -> underscore-form so
          # LogQL pipeline filters and `unwrap` use the standard naming convention.
          - set(attributes["claude_ratelimit_five_hour_pct"], attributes["claude.ratelimit.five_hour_pct"])
          - set(attributes["claude_ratelimit_seven_day_pct"], attributes["claude.ratelimit.seven_day_pct"])
          - set(attributes["claude_context_used_pct"], attributes["claude.context.used_pct"])
          - set(attributes["claude_turn"], attributes["claude.turn"])
          # Catalyst execution-model phase and context labels (OTL-3)
          - set(attributes["task_type"], resource.attributes["task.type"])
          - set(attributes["catalyst_exec_context"], resource.attributes["catalyst.exec_context"])
          # Catalyst dispatch-mode label (OTL-7): WHO dispatched the phase —
          # execution-core (daemon) vs orchestrate (/orchestrate wave). Emitted by
          # phase-agent-dispatch only when CATALYST_DISPATCH_MODE is set, so this
          # set() is a no-op (error_mode: ignore) until the catalyst emit side ships.
          - set(attributes["catalyst_dispatch_mode"], resource.attributes["catalyst.dispatch_mode"])
          # Account-level rate-limit usage (CTL-787): account.ratelimit.sampled event
          # (service.name=catalyst.execution-core) carries 5h/7d subscription usage % labeled by
          # account email. LOG-RECORD attributes (numeric/string) -> source is attributes[...],
          # not resource.attributes[...]. Rename dot->underscore for LogQL unwrap/labels. No-op
          # (error_mode: ignore) until the emit side ships.
          - set(attributes["account_email"], attributes["account.email"])
          - set(attributes["ratelimit_five_hour_pct"], attributes["ratelimit.five_hour_pct"])
          - set(attributes["ratelimit_seven_day_pct"], attributes["ratelimit.seven_day_pct"])
          - set(attributes["ratelimit_five_hour_resets_at"], attributes["ratelimit.five_hour_resets_at"])
          - set(attributes["ratelimit_seven_day_resets_at"], attributes["ratelimit.seven_day_resets_at"])
          - set(attributes["ratelimit_seven_day_opus_pct"], attributes["ratelimit.seven_day_opus_pct"])
          - set(attributes["ratelimit_seven_day_sonnet_pct"], attributes["ratelimit.seven_day_sonnet_pct"])
          - set(attributes["subscription_type"], attributes["subscription.type"])
          - set(attributes["rate_limit_tier"], attributes["rate_limit.tier"])
          # Standalone-host + multi-account agent telemetry (CTL-812): the new
          # catalyst.agent service emits per-host, per-process, and rate-limit
          # pace LOG-RECORD attributes. Same dot->underscore rename convention
          # for LogQL labels/unwrap. Source is attributes[...] (numeric/string),
          # not resource.attributes[...]. No-op (error_mode: ignore) until the
          # catalyst.agent emit side ships.
          # -- rate-limit pace (extends the CTL-787 account block) --
          - set(attributes["ratelimit_five_hour_pace"], attributes["ratelimit.five_hour_pace"])
          - set(attributes["ratelimit_seven_day_pace"], attributes["ratelimit.seven_day_pace"])
          # -- host metrics --
          - set(attributes["host_cpu_pct"], attributes["host.cpu_pct"])
          - set(attributes["host_cpu_count"], attributes["host.cpu_count"])
          - set(attributes["host_load1"], attributes["host.load1"])
          - set(attributes["host_mem_used_mb"], attributes["host.mem_used_mb"])
          - set(attributes["host_mem_total_mb"], attributes["host.mem_total_mb"])
          - set(attributes["host_mem_used_pct"], attributes["host.mem_used_pct"])
          - set(attributes["host_disk_used_gb"], attributes["host.disk_used_gb"])
          - set(attributes["host_disk_total_gb"], attributes["host.disk_total_gb"])
          - set(attributes["host_disk_used_pct"], attributes["host.disk_used_pct"])
          # -- per-process metrics --
          - set(attributes["process_command"], attributes["process.command"])
          - set(attributes["process_cpu_pct"], attributes["process.cpu_pct"])
          - set(attributes["process_rss_mb"], attributes["process.rss_mb"])
          - set(attributes["process_ticket"], attributes["process.ticket"])
          - set(attributes["process_phase"], attributes["process.phase"])
          # --- Log severity from pino numeric level ---
          # catalyst pino logs arrive with a numeric `level` attribute (pino:
          # 10=trace 20=debug 30=info 40=warn 50=error 60=fatal) but NO OTel
          # SeverityNumber/SeverityText, so every operational log renders as
          # UNKNOWN severity in Dash0/Loki (can't filter/alert/color by severity).
          # Map level -> the OTel Logs Data Model severity fields. DURABLE fix is
          # producer-side in otel-forward (it already sets severity for canonical
          # EVENTS, just not raw operational logs) — tracked in CTL Linear.
          # Guards: (1) only fill records whose severity is UNSET, so the events
          # that already set severity are never clobbered; (2) only when `level`
          # is present; Int() makes it robust to level arriving as int OR string.
          # set text BEFORE number so the UNSPECIFIED guard still holds for both.
          - set(severity_text, "TRACE") where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 10
          - set(severity_number, SEVERITY_NUMBER_TRACE) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 10
          - set(severity_text, "DEBUG") where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 20
          - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 20
          - set(severity_text, "INFO") where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 30
          - set(severity_number, SEVERITY_NUMBER_INFO) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 30
          - set(severity_text, "WARN") where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 40
          - set(severity_number, SEVERITY_NUMBER_WARN) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 40
          - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 50
          - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 50
          - set(severity_text, "FATAL") where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 60
          - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and attributes["level"] != nil and Int(attributes["level"]) == 60

  # OTL-20: normalize the CLASS B catalyst attribute keys the logs->metrics
  # connectors group/read by. Loki sanitizes dot->underscore on ingest, so the
  # underscore names seen in Loki are ambiguous about the in-collector form;
  # catalyst's emit convention (<namespace>.<field>, see transform/logs above)
  # implies these arrive DOT-form. Each guarded copy creates the underscore key
  # from the dot source when present; if the emitter is already underscore-native
  # the `where dot != nil` guard is false and it is a no-op. Correct either way.
  # (CLASS A fields — host.*/process.*/ratelimit.* — already get underscore
  # copies from transform/logs above, so they are NOT repeated here.) The
  # connectors consume the logs pipeline AFTER this processor.
  transform/metrics_normalize:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # event decomposition (low-card enums + the routing key event_name)
          - set(attributes["event_entity"], attributes["event.entity"]) where attributes["event.entity"] != nil
          - set(attributes["event_action"], attributes["event.action"]) where attributes["event.action"] != nil
          - set(attributes["event_name"], attributes["event.name"]) where attributes["event.name"] != nil
          # host.name is a RESOURCE attribute on catalyst events (clean short form:
          # mini, mini-2), NOT a log attribute. Every derived metric labels by
          # host_name, so without this copy EVERY datapoint is dropped for a
          # missing grouping key. Source it from the resource, not the log record.
          - set(attributes["host_name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
          # catalyst emits catalyst.ticket.type (all dots), not catalyst.ticket_type.
          - set(attributes["catalyst_ticket_type"], attributes["catalyst.ticket.type"]) where attributes["catalyst.ticket.type"] != nil
          # recovery decision/board-scan enums + invariant gauge
          - set(attributes["recovery_decision"], attributes["recovery.decision"]) where attributes["recovery.decision"] != nil
          - set(attributes["recovery_fix_class"], attributes["recovery.fix_class"]) where attributes["recovery.fix_class"] != nil
          - set(attributes["recovery_mode"], attributes["recovery.mode"]) where attributes["recovery.mode"] != nil
          - set(attributes["recovery_gate_decision"], attributes["recovery.gate_decision"]) where attributes["recovery.gate_decision"] != nil
          - set(attributes["recovery_invariants_failed"], attributes["recovery.invariants_failed"]) where attributes["recovery.invariants_failed"] != nil
          # scheduler gauges (autotune-gauge + parallelism-sampled events)
          - set(attributes["scheduler_load1"], attributes["scheduler.load1"]) where attributes["scheduler.load1"] != nil
          - set(attributes["scheduler_load_per_core"], attributes["scheduler.load_per_core"]) where attributes["scheduler.load_per_core"] != nil
          - set(attributes["scheduler_max_parallel_target"], attributes["scheduler.max_parallel_target"]) where attributes["scheduler.max_parallel_target"] != nil
          - set(attributes["scheduler_max_parallel_effective"], attributes["scheduler.max_parallel_effective"]) where attributes["scheduler.max_parallel_effective"] != nil
          - set(attributes["scheduler_max_parallel_current"], attributes["scheduler.max_parallel_current"]) where attributes["scheduler.max_parallel_current"] != nil
          - set(attributes["scheduler_running_workers"], attributes["scheduler.running_workers"]) where attributes["scheduler.running_workers"] != nil
          - set(attributes["scheduler_bg_count"], attributes["scheduler.bg_count"]) where attributes["scheduler.bg_count"] != nil
          - set(attributes["scheduler_mem_free_pct"], attributes["scheduler.mem_free_pct"]) where attributes["scheduler.mem_free_pct"] != nil
          # host gauges not already renamed by transform/logs (underscore-native suspected)
          - set(attributes["host_disk_avail_gb"], attributes["host.disk_avail_gb"]) where attributes["host.disk_avail_gb"] != nil
          - set(attributes["host_disk_free_pct"], attributes["host.disk_free_pct"]) where attributes["host.disk_free_pct"] != nil
          # catalyst.install lifecycle enums (CTL-1369): the install envelope carries
          # operation/phase/outcome as dotted top-level attributes -> underscore form
          # for the catalyst_install_* connectors. node_class rides the resource
          # (catalyst.node.class -> catalyst_node_class label) like every catalyst event.
          - set(attributes["operation"], attributes["catalyst.install.operation"]) where attributes["catalyst.install.operation"] != nil
          - set(attributes["outcome"], attributes["catalyst.install.outcome"]) where attributes["catalyst.install.outcome"] != nil
          - set(attributes["phase"], attributes["catalyst.install.phase"]) where attributes["catalyst.install.phase"] != nil
          # CTL-1403 / OTL-50 reads-by-source: emit-side dotted linear.read.{source,result}
          # -> bare connector labels (only set on catalyst.linear.read events via the guard,
          # so no collision with other events' fields). age_ms stays dotted (histogram reads
          # it directly, like install phase_duration_ms). Same pattern as install operation.
          - set(attributes["source"], attributes["linear.read.source"]) where attributes["linear.read.source"] != nil
          - set(attributes["result"], attributes["linear.read.result"]) where attributes["linear.read.result"] != nil

  # OTL-31: Tier-1 daemon scheduler-health logs (service_name=catalyst.execution-core,
  # CTL-1330/1332 full-pino-body) carry their fields ONLY in the JSON body string.
  transform/scheduler_health_promote:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - 'resource.attributes["service.name"] == "catalyst.execution-core" and IsMatch(body, "^\\{")'
        statements:
          - merge_maps(cache, ParseJSON(body), "upsert")
          - set(attributes["host_name"], cache["host_name"]) where cache["host_name"] != nil
          - replace_pattern(attributes["host_name"], "\\..*$", "")

          - set(attributes["sched_tick_total_ms"], cache["total_ms"]) where cache["total_ms"] != nil
          - set(attributes["sched_free_slots"], cache["free_slots"]) where cache["free_slots"] != nil
          - set(attributes["sched_eligible_count"], cache["eligible_count"]) where cache["eligible_count"] != nil
          - set(attributes["sched_liveness_fresh"], cache["liveness_fresh"]) where cache["liveness_fresh"] != nil
          - set(attributes["sched_is_tick"], "1") where cache["total_ms"] != nil

          - set(attributes["pass_eligible_read_ms"], cache["pass_durations"]["eligible-read"]) where cache["pass_durations"] != nil
          - set(attributes["pass_phantom_sweep_ms"], cache["pass_durations"]["phantom-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_watchdog_ms"], cache["pass_durations"]["watchdog"]) where cache["pass_durations"] != nil
          - set(attributes["pass_cost_cap_ms"], cache["pass_durations"]["cost-cap"]) where cache["pass_durations"] != nil
          - set(attributes["pass_stall_janitor_ms"], cache["pass_durations"]["stall-janitor"]) where cache["pass_durations"] != nil
          - set(attributes["pass_unstuck_sweep_ms"], cache["pass_durations"]["unstuck-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_recovery_pass_ms"], cache["pass_durations"]["recovery-pass"]) where cache["pass_durations"] != nil
          - set(attributes["pass_liveness_read_ms"], cache["pass_durations"]["liveness-read"]) where cache["pass_durations"] != nil
          - set(attributes["pass_board_health_ms"], cache["pass_durations"]["board-health"]) where cache["pass_durations"] != nil
          - set(attributes["pass_preemption_sweep_ms"], cache["pass_durations"]["preemption-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_advancement_ms"], cache["pass_durations"]["advancement"]) where cache["pass_durations"] != nil
          - set(attributes["pass_new_work_pull_ms"], cache["pass_durations"]["new-work-pull"]) where cache["pass_durations"] != nil
          - set(attributes["pass_terminal_sweep_ms"], cache["pass_durations"]["terminal-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_cooldown_gc_ms"], cache["pass_durations"]["cooldown-gc"]) where cache["pass_durations"] != nil
          - set(attributes["pass_reclaim_ms"], cache["pass_durations"]["reclaim"]) where cache["pass_durations"] != nil

          - set(attributes["event_loop_p50_ms"], cache["event_loop_p50_ms"]) where cache["event_loop_p50_ms"] != nil
          - set(attributes["event_loop_p99_ms"], cache["event_loop_p99_ms"]) where cache["event_loop_p99_ms"] != nil
          - set(attributes["event_loop_max_ms"], cache["event_loop_max_ms"]) where cache["event_loop_max_ms"] != nil
          - set(attributes["sched_is_event_loop"], "1") where cache["event_loop_p99_ms"] != nil

          - set(attributes["liveness_outcome"], cache["outcome"]) where cache["outcome"] != nil
          - set(attributes["sched_is_liveness"], "1") where cache["outcome"] != nil

  # OTL-38: the catalyst.updater plugin-pull daemon emits its refresh "metrics" as
  # fields inside ONE pino log line ("updater: refresh (CTL-1350)") on
  # service_name=catalyst.updater. That line reaches THIS collector (Alloy 5th
  # stream -> otelcol.exporter.otlphttp -> logs pipeline, NOT Loki-only), but the
  # fields are trapped in the JSON body — so promote them to log attributes the
  # same way transform/scheduler_health_promote does for execution-core.
  # host_name is already set from resource.attributes["host.name"] (short) by
  # transform/metrics_normalize above. node_class: Alloy stamps only host.name +
  # catalyst.node.name on this stream's resource, so lift catalyst.node.class from
  # the body onto the resource -> resource_to_telemetry promotes it to the
  # catalyst_node_class label (consistent with every catalyst event metric).
  transform/updater_promote:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - 'resource.attributes["service.name"] == "catalyst.updater" and IsMatch(body, "updater: refresh")'
        statements:
          - merge_maps(cache, ParseJSON(body), "upsert")
          - set(attributes["reason"], cache["reason"]) where cache["reason"] != nil
          - set(attributes["upd_pulled"], cache["pulled"]) where cache["pulled"] != nil
          - set(attributes["upd_changed"], cache["changed"]) where cache["changed"] != nil
          - set(attributes["upd_failed"], cache["failed"]) where cache["failed"] != nil
          - set(attributes["refresh_duration_ms"], cache["refresh_duration_ms"]) where cache["refresh_duration_ms"] != nil
          - set(resource.attributes["catalyst.node.class"], cache["catalyst.node.class"]) where cache["catalyst.node.class"] != nil
          - set(attributes["upd_is_refresh"], "1") where cache["refresh_duration_ms"] != nil

  # OTL-20: the count connector emits Delta-temporality sums; Prometheus needs
  # Cumulative. Passes already-cumulative metrics (claude_code_* OTLP) through
  # unchanged, so it is safe on the shared metrics pipeline.
  deltatocumulative: {}

  # OTL-20: the connectors set host_name as a metric ATTRIBUTE (controlled
  # low-card label). But the prometheus exporter's resource_to_telemetry_conversion
  # ALSO turns the RESOURCE attribute host.name into a host_name label -> a
  # duplicate-label collision that makes the exporter silently drop the ENTIRE
  # connector metric (symptom: zero catalyst_* series on :8889 while claude_code_*
  # still export fine). Delete resource host.name on connector-scoped metrics so
  # only the connector's own host_name attribute survives. claude_code metrics
  # (different scope) keep resource host.name -> host_name exactly as before.
  transform/connector_metric_fixup:
    error_mode: ignore
    metric_statements:
      - context: metric
        conditions:
          - 'IsMatch(instrumentation_scope.name, "connector")'
        statements:
          - delete_key(resource.attributes, "host.name")

  # OTL-20: the signal_to_metrics connector stamps a per-run
  # signal_to_metrics.service.instance.id onto its output resource, which
  # resource_to_telemetry_conversion would turn into a churny label that changes
  # on every collector restart. Drop it (no-op for metrics that lack it).
  resource/strip_connector_iid:
    attributes:
      - key: signal_to_metrics.service.instance.id
        action: delete

  # OTL-25: traces tail sampling. Keeps every span that matters — slow ticks
  # (the event-loop-blocking wedge signal) and errors — and probabilistically
  # samples the rest so trace volume stays bounded once the daemons emit spans
  # (producer side = CTL-1330). tail_sampling buffers each trace until
  # decision_wait, then ORs the policies: a trace is kept if ANY policy matches.
  # We run a single collector instance, so all spans of a trace arrive here and
  # the decision is complete. Inert until traces actually flow.
  # OTL-56: drop THIRD-PARTY CRATE INTERNALS from traces.
  #
  # codex-app-server emits Rust `h2` HTTP/2 library internals as spans — one per
  # frame operation (`send_data`, `reserve_capacity`, `assign_connection_capacity`,
  # `Prioritize::queue_frame`, …). Measured cost: **$61.10/30d on Dash0 alone**
  # (~102M spans), and Honeycomb receives a byte-identical stream, so roughly
  # double that in reality. This is TRACE-level instrumentation that escaped to
  # production; nobody has ever wanted these spans in any backend.
  #
  # SELECTOR — why `code.file.path` and not the span name or scope:
  #   * span NAMES are arbitrary Rust fn names and would need endless upkeep;
  #   * the instrumentation SCOPE is just "codex-app-server" for every span,
  #     so it cannot discriminate (verified against a live trace).
  #   * `code.file.path` for these spans is
  #     /Users/runner/.cargo/registry/src/…/h2-0.4.13/src/proto/streams/…
  #     i.e. the cargo registry. A span whose source file lives in the registry
  #     is BY CONSTRUCTION third-party crate internals, never codex's own code —
  #     so codex's real spans (`list_models`, `auth`,
  #     `endpoint_session.execute_with`, `codex_core::*`) are structurally safe.
  #     It is also future-proof: another crate leaking spans is caught for free.
  #
  # TRADE-OFF: if a dependency ever emits a span we genuinely want (say a DB
  # driver's query span), this drops it. Narrow to `IsMatch(attributes["target"],
  # "^h2::")` if that happens.
  #
  # NIL-GUARD IS LOAD-BEARING: most spans have no `code.file.path`, and
  # IsMatch(nil, …) raises. We deliberately do NOT set `error_mode: ignore` —
  # on 0.154.0 that silently breaks ALL output from the processor — so the
  # `!= nil` short-circuit is what keeps the default (propagate) mode safe.
  #
  # Applied to the ONE traces pipeline, so it drops for Tempo as well as the
  # vendors. That is intentional and keeps the OTL-1 payload-parity invariant
  # intact: these spans have no diagnostic value anywhere.
  filter/drop_crate_internals:
    traces:
      span:
        - 'attributes["code.file.path"] != nil and IsMatch(attributes["code.file.path"], "/\\.cargo/registry/")'

  tail_sampling:
    decision_wait: 10s
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-ticks
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 20

  # CTL-1731: bound every export to Loki so one request can never exceed Loki's
  # 4 MiB gRPC receive limit. This is the fix for a 19-day logs outage
  # (2026-08-03 → 2026-08-22) in which NOTHING reached Loki from the host fleet.
  #
  # The chain, as measured on 2026-08-23:
  #   1. The logs pipeline had NO batch processor, and `otlp_http` (Loki) does no
  #      batching of its own, so one receive was forwarded to Loki 1:1.
  #   2. `otel-forward` on each host drains its WHOLE buffer into a single POST,
  #      so any backlog produces enormous single requests — measured 8241 records
  #      / 5,154,713 bytes, with bodies up to 7.16 MB.
  #   3. Loki refused every one of them, two ways:
  #        503 ResourceExhausted — "grpc: received message larger than max
  #            (7130780 vs. 4194304)"   ← server.grpc_server_max_recv_msg_size
  #        429 — "ingestion rate limit exceeded for user fake
  #            (limit: 4194304 bytes/sec)"   ← limits_config.ingestion_rate_mb: 4
  #   4. The exporter retried (29–43 s backoffs), its consumers blocked, the
  #      sending queue filled, and the OTLP RECEIVER then returned 503 to every
  #      producer. That receiver-level 503 is what the hosts recorded as
  #      "OTLP HTTP 503" — which is why a small probe still got 200 (it fits in a
  #      queue gap) while real traffic never did. The endpoint was never down.
  #
  # `send_batch_max_size` is a HARD splitter: no batch leaves this processor with
  # more records, so a slow/backlogged producer can no longer synthesize a request
  # Loki must refuse. At the measured ~625 B/record, 1000 records ≈ 0.8 MB — a ~5x
  # margin under the 4 MiB ceiling that still holds if mean record size triples.
  #
  # Deliberately NOT raising Loki's limits instead: steady-state fleet volume is
  # ~4 KB/s (two hosts, ~154 MB/day each), three orders of magnitude under the
  # 4 MB/s ingestion cap. The cap was only ever breached by unbounded batches, so
  # bounding the batch is the smaller and more durable change — and it protects
  # Loki from every producer, not just this one.
  batch/loki:
    send_batch_size: 500
    send_batch_max_size: 1000
    timeout: 5s

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    # Keep this only modestly longer than the agent emit interval (~5m). A short
    # window means a stale series shape (e.g. an old commit/version label-set
    # after a deploy, or an offline host) stops being re-published within
    # minutes instead of lingering for hours — which is what made the same host
    # appear as multiple "ghost" series across panels (CTL-1235 follow-up).
    metric_expiration: 15m
    resource_to_telemetry_conversion:
      enabled: true

  # OTL-54: DEFINED but no longer wired into any PUBLIC pipeline. `verbosity:
  # normal` serializes every record to stdout; with Docker's json-file driver
  # unrotated that grew this container's log to 314 GiB (~12.7 GB/day). The
  # definition stays because the PRIVATE Cloudflare pipelines
  # (catalyst-otel-private/private/collector-config-private.yaml) still list it
  # — deleting it here would fail their validation at boot. Removing it there is
  # the follow-up that actually gets the log down to operational-only volume.
  # Re-add to a pipeline only while actively debugging, then remove.
  debug:
    verbosity: normal

  # Loki OTLP/HTTP exporter. Renamed otlphttp -> otlp_http (OTL-8): the bare
  # "otlphttp" alias is deprecated in otelcol-contrib v0.149.0 and logs a
  # startup deprecation warning ("\"otlphttp\" alias is deprecated; use
  # \"otlp_http\" instead"). The canonical factory id is otlp_http.
  otlp_http:
    endpoint: http://otel-loki:3100/otlp

  # ---------------------------------------------------------------------------
  # Fan-out exporters (CTL-812 / OTL-1). Honeycomb ENABLED 2026-06-07 — env vars
  # live in /home/rozich/otel-stack/.env (gitignored).
  #
  # Dash0 REMOVED FROM THE PUBLIC PIPELINES 2026-08-01 (OTL-64): the
  # metrics/logs/traces pipelines below shipped fully unsampled logs+metrics
  # that duplicated Loki/Prometheus with no alerting/tracing/automation
  # workflow actually built on Dash0 — pure cost ($41.17/30d) for zero payoff.
  #
  # The otlp_http/dash0 EXPORTER BLOCK ITSELF STAYS DECLARED (uncommented) —
  # do NOT re-comment it. The private overlay (otel-stack-private,
  # docker-compose.override.yml + collector-config-private.yaml) merges a
  # SECOND config at boot whose logs/cloudflare, traces/cloudflare_vendors,
  # and metrics/cloudflare pipelines reference this SAME exporter id (map keys
  # merge across the two --config files — see docker-compose.override.yml's
  # merge-semantics comment). Fully commenting it out here crash-loops the
  # collector with "references exporter \"otlp_http/dash0\" which is not
  # configured" (hit live during the OTL-64 deploy, rolled back same-day).
  # DASH0_OTLP_ENDPOINT/DASH0_AUTH_TOKEN must stay set in production for that
  # reason too. If the Cloudflare→Dash0 leg is ever also cut, that is a
  # private-repo change, not this file.
  #
  # To ADD Dash0 back to a public pipeline: append `otlp_http/dash0` to that
  # pipeline's exporters list below (the block is already declared, no need to
  # uncomment anything).
  #
  # PAYLOAD-PARITY INVARIANT (OTL-1 — the architectural rule of this file):
  # this collector runs processing/transforms (resource, transform/logs)
  # BEFORE storage, so a new destination is added ONLY by appending its
  # exporter to the exporters list of the EXISTING pipeline — NEVER by
  # creating a parallel per-vendor pipeline (e.g. logs/honeycomb). A parallel
  # pipeline lets the processor chains drift apart and the destinations
  # silently fall out of sync: every destination must receive the IDENTICAL
  # post-transform payload. Per-exporter FORMAT settings (e.g. prometheus
  # resource_to_telemetry_conversion) are fine — destination-specific
  # post-PROCESSING is not. validate-dashboard.sh enforces the
  # one-pipeline-per-signal rule.
  # ---------------------------------------------------------------------------

  # Honeycomb (logs). Endpoint is the standard ingest URL. The dataset header
  # is required for non-tracing signals (logs/metrics); for traces Honeycomb
  # routes by service.name and the dataset header is ignored.
  otlp_http/honeycomb:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
      x-honeycomb-dataset: ${env:HONEYCOMB_DATASET}

  # Dash0. Endpoint and bearer token both come from env. STAYS DECLARED even
  # though no PUBLIC pipeline below uses it anymore (OTL-64) — the private
  # overlay's Cloudflare pipelines still reference this exporter id. See the
  # fan-out header comment above before touching this block.
  otlp_http/dash0:
    endpoint: ${env:DASH0_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:DASH0_AUTH_TOKEN}

  # OTL-25: Tempo (traces). STATIC endpoint — never env-driven. A declared
  # exporter with an empty endpoint crash-loops the collector at boot — the
  # reason otlp_http/dash0 above stays declared with its env vars set in
  # production (see the fan-out header comment) rather than being commented
  # out. Tempo is in-cluster so plaintext gRPC with tls.insecure is correct;
  # we reach it at the container name on otel-network.
  otlp/tempo:
    endpoint: otel-tempo:4317
    tls:
      insecure: true

# ---------------------------------------------------------------------------
# OTL-20: derive Prometheus metrics from catalyst log events (logs->metrics).
# High-volume catalyst signals (event occurrences, scheduler/host gauges,
# decisions, rate-limit usage) live ONLY as Loki log lines today; aggregating
# them means count_over_time at dashboard load — expensive, and it trips Loki's
# max_query_series=500 cap on the high-card event_name family. These connectors
# turn them into cheap, uncapped, alertable Prometheus series.
#
# CARDINALITY RULE (hard): labels are ONLY low-card enums — event_entity,
# event_action, host_name, recovery_*, catalyst_ticket_type, rate_limit_tier.
# NEVER event_name / event_label / session.id / linear_key / ticket / branch /
# account_email (PII) / process_command (dirty). Spend & tokens are already
# native Prometheus counters (claude_code_*); not duplicated here.
#
# Wiring (respects the OTL-1 one-pipeline-per-signal invariant): the connectors
# are EXPORTERS on the existing logs pipeline (consumed AFTER transform/logs +
# transform/metrics_normalize, so every key is underscore form) and RECEIVERS on
# the existing metrics pipeline (-> prometheus + fan-out). deltatocumulative on
# the metrics pipeline converts the count connector's Delta sums to Cumulative.
# ---------------------------------------------------------------------------
connectors:
  # Occurrence / decision counters (Delta sums -> deltatocumulative -> Prometheus).
  # NOTE: do NOT set `error_mode: ignore` on these connectors — in otelcol 0.154.0
  # it suppresses ALL metric output (produces zero series). Verified empirically:
  # default error_mode already drops bad datapoints gracefully (a non-numeric /
  # empty / missing field returns HTTP 200, not a 5xx back to the sender), so the
  # shared logs batch is never failed. Leave error_mode at its default.
  count:
    logs:
      catalyst_event_total:
        description: "Catalyst events by entity/action/host (replaces Loki count_over_time; uncapped)"
        conditions:
          - 'attributes["event_entity"] != nil'
        attributes:
          - key: event_entity
          - key: event_action
          - key: host_name
      catalyst_dispatch_total:
        description: "Phase-dispatch outcomes (requested/launched/failed/runaway/enqueued). Hero = rate(action=launched); per-TICKET suffix kept OUT of labels."
        conditions:
          - 'IsMatch(attributes["event_name"], "^phase.dispatch.")'
        attributes:
          - key: event_action
          - key: reason
          - key: catalyst_ticket_type
          - key: host_name
      catalyst_recovery_decision_total:
        description: "Recovery-controller fix/escalate decisions by fix_class and mode"
        conditions:
          - 'attributes["event_name"] == "recovery.decision"'
        attributes:
          - key: recovery_decision
          - key: recovery_fix_class
          - key: recovery_mode
          - key: host_name
      catalyst_recovery_board_scan_total:
        description: "Recovery board-scan gate verdicts (proceed/skip) by mode"
        conditions:
          - 'attributes["event_name"] == "recovery.board-scan"'
        attributes:
          - key: recovery_gate_decision
          - key: recovery_mode
          - key: host_name
      catalyst_liveness_refresh_total:
        description: "Liveness-refresh outcomes (resolved/timeout/error). rate(outcome=timeout)>0 = wedge alarm"
        conditions:
          - 'attributes["sched_is_liveness"] == "1"'
        attributes:
          - key: liveness_outcome
          - key: host_name

      # ----- claude_code logs->metrics (OTL-21) -----
      # Occurrence counters for the three claude_code events that have NO native
      # Prometheus counter today (cost/tokens/sessions/commits/PRs/lines/decision
      # already exist as claude_code_* — NOT duplicated here). Low-card connector
      # labels ONLY; never session_id / error text / tool_input. event_name is the
      # short form ("tool_result"), confirmed live.
      #
      # CARDINALITY (verified live, 68 series): unlike the NATIVE claude_code_*
      # metrics (which Claude Code exports with project / branch / linear_key /
      # session_id / host.name on their resource -> 12k+ series), the claude_code
      # LOG/EVENT records carry only the low-card resource attrs (os_type /
      # os_version / host_arch / service_version / environment). So
      # resource_to_telemetry_conversion promotes ONLY those onto these connector
      # metrics — project / branch / hostname / linear_key / session_id are NOT
      # present. (host.name is additionally stripped on all connector-scope metrics
      # by transform/connector_metric_fixup above.) Net: these stay genuinely
      # low-card, but they also CANNOT be sliced by project / branch / host — the
      # by-ticket / by-project tool breakdowns therefore stay on Loki, and the
      # migrated PromQL tiles are fleet-wide aggregates.
      claude_code_tool_result_total:
        description: "Claude Code tool executions by tool and success (replaces Loki count_over_time on tool_result; uncapped). NOTE: tool_result carries NO model attribute."
        conditions:
          - 'attributes["event_name"] == "tool_result"'
        attributes:
          - key: tool_name
          - key: success
      claude_code_api_request_total:
        description: "Claude Code API requests by model (occurrence count; cost/tokens stay on native claude_code_* counters)"
        conditions:
          - 'attributes["event_name"] == "api_request"'
        attributes:
          - key: model
      claude_code_api_error_total:
        description: "Claude Code API errors by model and HTTP status_code (e.g. 429). error text intentionally NOT a label (unbounded)"
        conditions:
          - 'attributes["event_name"] == "api_error"'
        attributes:
          - key: model
          # status_code is "present only when applicable" (network / timeout
          # failures carry none). The count connector DROPS any datapoint missing
          # a no-default attribute, so without this default those provider failures
          # would never increment the counter -> the api-error alert goes blind to
          # a whole class of errors. Low-card sentinel keeps every api_error counted.
          - key: status_code
            default_value: "unknown"

      # ----- catalyst.updater plugin-pull refreshes (OTL-38) -----
      # Occurrence count of refreshes by reason (+ host_name + the resource-promoted
      # catalyst_node_class). Keyed on the upd_is_refresh marker that
      # transform/updater_promote stamps when it parses a "updater: refresh" line.
      catalyst_updater_refresh_total:
        description: "Updater plugin-pull refreshes by reason (occurrence; service_name=catalyst.updater)"
        conditions:
          - 'attributes["upd_is_refresh"] == "1"'
        attributes:
          - key: reason
            default_value: unknown
          - key: host_name

      # ----- catalyst.install lifecycle terminal outcomes (CTL-1369) -----
      # Bare install occurrences already land in catalyst_event_total{event_entity=
      # "install"} for free; this adds the operation x outcome faceting Ryan wants.
      # Service-name-agnostic (the install envelope presets event.entity/action).
      catalyst_install_total:
        description: "Install/uninstall/reinstall terminal outcomes by operation and outcome"
        conditions:
          - 'IsMatch(attributes["event_name"], "^catalyst.install.(completed|failed|rolled_back)$")'
        attributes:
          - key: operation
            default_value: install
          - key: outcome
            default_value: unknown
          - key: host_name

      # ----- catalyst.linear reads-by-source (CTL-1403 / OTL-50) -----
      # Every Linear read by source + outcome across 3 emit sites (daemon
      # fetchTicketState = catalyst.execution-core; agent bash linear_read_ticket +
      # CLI linear-cli.mjs = catalyst.linear-read). Service-name-agnostic (gates on
      # event_name only, like the install/checkout counters). source/result are the
      # bare labels transform/metrics_normalize copies from linear.read.{source,result}.
      # Three signals from one counter: {source="linearis"}=replica bypass (guarantee
      # violated), {source=~"linearis.*"}=quota burn (all live-API toward the 5000/hr
      # wall), {source="linearis_miss"}=replica sync-lag; {result="failed"}=read-path
      # blocked (supersedes the OTL-40 `issues list failed` Loki grep). host_name
      # defaulted so an agent read that lacks a resource host.name still counts.
      catalyst_linear_read_total:
        description: "Linear reads by source (replica/linearis/linearis_miss/linearis_exception) and result (ok/failed) — reads-by-source + replica-bypass (CTL-1403)"
        conditions:
          - 'attributes["event_name"] == "catalyst.linear.read"'
        attributes:
          - key: source
          - key: result
          - key: host_name
            default_value: unknown

  # Numeric gauges from event fields. Values are strings in transit -> Double() cast.
  # Do NOT set `error_mode: ignore` here — in otelcol 0.154.0 it suppresses ALL
  # gauge output. The default already handles a bad Double() cast safely: the
  # offending datapoint is dropped and the log batch still returns HTTP 200
  # (verified against missing / empty / non-numeric field values), so a malformed
  # sample can't 5xx the shared logs ingestion path.
  signal_to_metrics:
    logs:
      # --- scheduler autotune-gauge (phase.scheduler.autotune-gauge.<orchestration>) ---
      - name: catalyst_scheduler_load1
        description: "Scheduler 1-min load average"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_load1"])'
      - name: catalyst_scheduler_load_per_core
        description: "Scheduler load normalized by core count"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_load_per_core"])'
      - name: catalyst_scheduler_max_parallel_target
        description: "Autotuner target parallel-slot count"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_max_parallel_target"])'
      - name: catalyst_scheduler_max_parallel_effective
        description: "Effective (applied) parallel-slot count after autotune clamp"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_max_parallel_effective"])'
      - name: catalyst_scheduler_running_workers
        description: "Concurrent running workers at sample time"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_running_workers"])'
      - name: catalyst_scheduler_mem_free_pct
        description: "Scheduler view of free memory percent"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_mem_free_pct"])'
      # --- scheduler parallelism-sampled (phase.scheduler.parallelism-sampled.<orchestration>) ---
      - name: catalyst_scheduler_max_parallel_current
        description: "Current max-parallel observed at sample time"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.parallelism-sampled")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_max_parallel_current"])'
      - name: catalyst_scheduler_bg_count
        description: "Background/queued job count at sample time"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.parallelism-sampled")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_bg_count"])'
      # --- host metrics (host.metrics.sampled, exact match) ---
      - name: catalyst_host_cpu_pct
        description: "Host CPU utilization percent (agent-reported)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_cpu_pct"])'
      - name: catalyst_host_load1
        description: "Host 1-min load average (agent-reported)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_load1"])'
      - name: catalyst_host_cpu_count
        description: "Host core count (capacity)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_cpu_count"])'
      - name: catalyst_host_mem_used_pct
        description: "Host memory utilization percent"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_mem_used_pct"])'
      - name: catalyst_host_mem_used_mb
        description: "Host memory used (MB)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_mem_used_mb"])'
      - name: catalyst_host_mem_total_mb
        description: "Host total RAM (MB, capacity)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_mem_total_mb"])'
      - name: catalyst_host_disk_used_pct
        description: "Host disk utilization percent"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_disk_used_pct"])'
      - name: catalyst_host_disk_free_pct
        description: "Host disk free percent"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_disk_free_pct"])'
      - name: catalyst_host_disk_avail_gb
        description: "Host disk available (GB) — absolute headroom"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_disk_avail_gb"])'
      - name: catalyst_host_disk_used_gb
        description: "Host disk used (GB)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_disk_used_gb"])'
      - name: catalyst_host_disk_total_gb
        description: "Host disk total (GB, capacity)"
        conditions: ['attributes["event_name"] == "host.metrics.sampled"']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["host_disk_total_gb"])'
      # --- account rate-limit usage (account.ratelimit.sampled; CTL-787 gap, no Prom equiv) ---
      - name: catalyst_account_ratelimit_five_hour_pct
        description: "Account 5-hour rate-limit utilization percent"
        conditions: ['attributes["event_name"] == "account.ratelimit.sampled"']
        attributes:
          - key: host_name
          - key: rate_limit_tier
        gauge:
          value: 'Double(attributes["ratelimit_five_hour_pct"])'
      - name: catalyst_account_ratelimit_seven_day_pct
        description: "Account 7-day rate-limit utilization percent"
        conditions: ['attributes["event_name"] == "account.ratelimit.sampled"']
        attributes:
          - key: host_name
          - key: rate_limit_tier
        gauge:
          value: 'Double(attributes["ratelimit_seven_day_pct"])'
      - name: catalyst_account_ratelimit_seven_day_sonnet_pct
        description: "Account 7-day Sonnet-model rate-limit utilization percent"
        conditions: ['attributes["event_name"] == "account.ratelimit.sampled"']
        attributes:
          - key: host_name
          - key: rate_limit_tier
        gauge:
          value: 'Double(attributes["ratelimit_seven_day_sonnet_pct"])'
      - name: catalyst_account_ratelimit_five_hour_pace
        description: "Account 5-hour burn-rate pace (signed; <0 = under pace)"
        conditions: ['attributes["event_name"] == "account.ratelimit.sampled"']
        attributes:
          - key: host_name
          - key: rate_limit_tier
        gauge:
          value: 'Double(attributes["ratelimit_five_hour_pace"])'
      - name: catalyst_account_ratelimit_seven_day_pace
        description: "Account 7-day burn-rate pace (signed)"
        conditions: ['attributes["event_name"] == "account.ratelimit.sampled"']
        attributes:
          - key: host_name
          - key: rate_limit_tier
        gauge:
          value: 'Double(attributes["ratelimit_seven_day_pace"])'

      # --- OTL Task C (Ryan-directed, 2026-08-24): AI subscription-limit
      # consumed, the "denominator" for retail-$-per-subscription-window
      # efficiency (see dashboards/ai-usage.json "Subscription Efficiency"
      # row + provisioning/prometheus/recording-rules.yml's
      # ai_efficiency_retail_usd_per_limit_pct rules). Emitted by
      # scripts/ai-subscription-limit-scraper.sh (cron/launchd, laptop-side)
      # -- NOT the same signal as catalyst_account_ratelimit_*_pct above:
      # those are wired to an `account.ratelimit.sampled` event that (per the
      # CTL-787/CTL-812 comments earlier in this file) has never actually
      # been emitted (0 series live, checked 2026-08-24) and carries
      # `rate_limit_tier`, not a specific fleet-account identity. This gauge
      # carries the real per-account label (`account`: Claude's fleet
      # rotation slot e.g. "acct6", or Codex's ChatGPT account_id e.g.
      # "codex-641648d1") plus `provider` and `window` ("5h"/"7d"), and IS
      # live -- proven end-to-end 2026-08-24 (13 real samples, laptop
      # scraper -> OTLP/HTTP -> this collector -> Loki, verified via the
      # Grafana datasource proxy) as of this PR's authoring, though the
      # gauge conversion below only takes effect once this collector config
      # is deployed (restart required, same as any other collector-config.yaml
      # change).
      - name: ai_subscription_limit_used_percent
        description: "Percent of a provider account's subscription rate-limit window consumed (denominator for retail-$-per-subscription-window efficiency)"
        conditions: ['attributes["event_name"] == "ai.subscription_limit.sampled"']
        attributes:
          - key: provider
          - key: account
          - key: window
        gauge:
          value: 'Double(attributes["used_percent"])'

      # --- recovery fleet-health gauge (recovery.board-scan) ---
      - name: catalyst_recovery_invariants_failed
        description: "Count of failed recovery invariants per board-scan (0..7)"
        conditions: ['attributes["event_name"] == "recovery.board-scan"']
        attributes:
          - key: host_name
          - key: recovery_mode
        gauge:
          value: 'Double(attributes["recovery_invariants_failed"])'

      # OTL-31 scheduler-health HISTOGRAMS
      - name: catalyst_scheduler_tick_duration_seconds
        description: "Scheduler full-tick wall time (seconds)."
        conditions: ['attributes["sched_is_tick"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
        histogram:
          buckets: [0.1, 0.25, 0.5, 1, 2, 3, 5, 8, 13, 21, 34, 55]
          value: 'Double(attributes["sched_tick_total_ms"]) / 1000'

      - name: catalyst_scheduler_pass_duration_seconds
        description: "Per-pass duration (seconds), pass=eligible-read"
        conditions: ['attributes["pass_eligible_read_ms"] != nil']
        attributes:
          - key: host_name
            default_value: unknown
          - key: pass
            default_value: eligible-read
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.05, 0.25, 0.5, 1, 2, 3, 8, 21, 40]
          value: 'Double(attributes["pass_eligible_read_ms"]) / 1000'
      - name: catalyst_scheduler_pass_duration_seconds
        description: "Per-pass duration (seconds), pass=phantom-sweep"
        conditions: ['attributes["pass_phantom_sweep_ms"] != nil']
        attributes:
          - key: host_name
            default_value: unknown
          - key: pass
            default_value: phantom-sweep
        histogram:
          buckets: [0.001, 0.005, 0.01, 0.05, 0.25, 0.5, 1, 2, 3, 8, 21, 40]
          value: 'Double(attributes["pass_phantom_sweep_ms"]) / 1000'
      - name: catalyst_scheduler_pass_duration_seconds
        description: "Per-pass duration (seconds), pass=watchdog"
        conditions: ['attributes["pass_watchdog_ms"] != nil']
        attributes:
