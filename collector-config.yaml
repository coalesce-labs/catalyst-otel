          value: 'Double(attributes["pass_reclaim_ms"]) / 1000'

      # OTL-31 event-loop delay GAUGES (3 quantile series)
      - name: catalyst_scheduler_event_loop_delay_seconds
        description: "Event-loop delay p50 (seconds)"
        conditions: ['attributes["sched_is_event_loop"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
          - key: quantile
            default_value: p50
        gauge:
          value: 'Double(attributes["event_loop_p50_ms"]) / 1000'
      - name: catalyst_scheduler_event_loop_delay_seconds
        description: "Event-loop delay p99 (seconds)"
        conditions: ['attributes["sched_is_event_loop"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
          - key: quantile
            default_value: p99
        gauge:
          value: 'Double(attributes["event_loop_p99_ms"]) / 1000'
      - name: catalyst_scheduler_event_loop_delay_seconds
        description: "Event-loop delay max (seconds)"
        conditions: ['attributes["sched_is_event_loop"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
          - key: quantile
            default_value: max
        gauge:
          value: 'Double(attributes["event_loop_max_ms"]) / 1000'

      # OTL-31 wedge primitives
      - name: catalyst_scheduler_liveness_fresh
        description: "1 when liveness is fresh, 0 when stale"
        conditions: ['attributes["sched_is_tick"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
        gauge:
          value: 'Double(attributes["sched_liveness_fresh"])'
      - name: catalyst_scheduler_free_slots
        description: "Free dispatch slots at tick time"
        conditions: ['attributes["sched_is_tick"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
        gauge:
          value: 'Double(attributes["sched_free_slots"])'
      - name: catalyst_scheduler_eligible_work
        description: "Eligible-but-undispatched ticket count at tick time"
        conditions: ['attributes["sched_is_tick"] == "1"']
        attributes:
          - key: host_name
            default_value: unknown
        gauge:
          value: 'Double(attributes["sched_eligible_count"])'
      # OTL-21: claude_code API-request latency histogram. Same pattern as the
      # OTL-31 scheduler histograms (signal_to_metrics + Double()/1000 -> seconds).
      # duration_ms is a log-record attribute (string) on api_request -> Double cast.
      # Name ends _seconds; no `unit:` (avoids a double _seconds_seconds suffix).
      - name: claude_code_api_request_duration_seconds
        description: "Claude Code API request wall time (seconds) by model"
        conditions: ['attributes["event_name"] == "api_request"']
        attributes:
          - key: model
            default_value: unknown
        histogram:
          buckets: [0.25, 0.5, 1, 2, 5, 10, 30, 60]
          value: 'Double(attributes["duration_ms"]) / 1000'

      # ----- catalyst.updater refresh duration + throughput (OTL-38) -----
      # refresh_duration_ms / pulled / changed / failed are promoted out of the pino
      # body by transform/updater_promote. Duration -> histogram (ms/1000 -> seconds,
      # same pattern as the claude_code + scheduler histograms). pulled/changed/failed
      # are the per-refresh field VALUES summed (NOT occurrence counts) -> sum metrics;
      # deltatocumulative converts the delta sums to cumulative for increase().
      - name: catalyst_updater_refresh_duration_seconds
        description: "Updater plugin-pull refresh wall time (seconds) by reason"
        conditions: ['attributes["upd_is_refresh"] == "1"']
        attributes:
          - key: reason
            default_value: unknown
          - key: host_name
            default_value: unknown
        histogram:
          buckets: [0.1, 0.25, 0.5, 1, 2, 5, 10, 30, 60]
          value: 'Double(attributes["refresh_duration_ms"]) / 1000'
      - name: catalyst_updater_refresh_pulled_total
        description: "Total plugin checkouts pulled across refreshes (sum of refresh.pulled)"
        conditions: ['attributes["upd_is_refresh"] == "1"']
        attributes:
          - key: reason
            default_value: unknown
          - key: host_name
            default_value: unknown
        sum:
          value: 'Double(attributes["upd_pulled"])'
      - name: catalyst_updater_refresh_changed_total
        description: "Total plugin checkouts changed across refreshes (sum of refresh.changed)"
        conditions: ['attributes["upd_is_refresh"] == "1"']
        attributes:
          - key: reason
            default_value: unknown
          - key: host_name
            default_value: unknown
        sum:
          value: 'Double(attributes["upd_changed"])'
      - name: catalyst_updater_refresh_failed_total
        description: "Total plugin-checkout failures across refreshes (sum of refresh.failed; >0 = pull trouble)"
        conditions: ['attributes["upd_is_refresh"] == "1"']
        attributes:
          - key: reason
            default_value: unknown
          - key: host_name
            default_value: unknown
        sum:
          value: 'Double(attributes["upd_failed"])'

      # ----- catalyst.install per-phase duration (CTL-1369) — GATED, ships EMPTY -----
      # The per-phase duration is emitted in body.payload, which otel-forward strips
      # at the node BEFORE the network hop, so it never reaches the collector today.
      # Asked the updater (channel turn 11) to promote it to a top-level attribute
      # catalyst.install.phase_duration_ms. Built now so it lights up the instant that
      # attribute lands — no redeploy. Until then Double(nil) drops the datapoint.
      - name: catalyst_install_duration_seconds
        description: "Install phase wall time (seconds) by phase + operation (GATED on phase_duration_ms attr)"
        conditions: ['attributes["event_name"] == "catalyst.install.phase"']
        attributes:
          - key: phase
            default_value: unknown
          - key: operation
            default_value: install
          - key: host_name
            default_value: unknown
        histogram:
          buckets: [0.25, 0.5, 1, 2, 5, 10, 30, 60, 120]
          value: 'Double(attributes["catalyst.install.phase_duration_ms"]) / 1000'

      # ----- catalyst.linear read staleness (CTL-1403 / OTL-50) — SPARSE -----
      # Replica read staleness distribution (linear.read.age_ms / 1000) by source —
      # the user-facing "how stale is what agents read" number; p99 backs the
      # freshness-SLO alert. Sparse initially: age_ms currently rides only the CLI
      # replica-hit + daemon live-read paths (the replica-tier epoch-ms<->ISO parity
      # age is a READ-SDK fast-follow), so Double(nil) drops the datapoint until then.
      # Buckets in seconds: replica staleness lives ~0-30s (cloud-sync polls ~30s),
      # tail to 1h for pathological lag.
      - name: catalyst_linear_read_age_seconds
        description: "Linear replica read staleness (seconds) by source — user-facing freshness (GATED on age_ms; CTL-1403)"
        conditions: ['attributes["event_name"] == "catalyst.linear.read"']
        attributes:
          - key: source
        histogram:
          buckets: [1, 5, 15, 30, 60, 120, 300, 600, 1800, 3600]
          value: 'Double(attributes["linear.read.age_ms"]) / 1000'

service:
  # ---------------------------------------------------------------------------
  # SELF-TELEMETRY (OTL-55). Without this block the collector emits NONE of its
  # own internal metrics: `count({__name__=~"otelcol_.+"})` returned an empty
  # vector, and :8888 refused connections outright (verified — :8889, the
  # prometheus EXPORTER, is a different thing and was always up). That blind
  # spot is why 314 GiB of log growth (OTL-54) and an ongoing 503/data-loss bug
  # both ran for weeks with nothing to alert on.
  #
  # `host: 0.0.0.0` is REQUIRED, not cosmetic: the collector defaults this
  # endpoint to localhost, which is unreachable from the Prometheus container
  # across the docker network. Bound to loopback it would look identical to
  # "not configured" from every scrape.
  #
  # level: normal emits the metrics that matter here —
  #   otelcol_exporter_queue_size / _queue_capacity   (saturation)
  #   otelcol_exporter_enqueue_failed_*               (the 503 mechanism)
  #   otelcol_exporter_send_failed_*                  (per-destination drops)
  #   otelcol_receiver_refused_*  /  _processor_dropped_*
  # `detailed` additionally emits per-RPC series; it is higher cardinality and
  # was deliberately NOT chosen. Prometheus scrapes this via a second job in
  # prometheus.yml (targets otel-collector:8888).
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888

  # PAYLOAD-PARITY INVARIANT (OTL-1): exactly ONE pipeline per signal type.
  # Fan out by appending exporters to the existing pipeline (after the shared
  # processors) so every destination receives the identical post-transform
  # payload. Never add a parallel per-vendor pipeline (logs/xxx, metrics/xxx).
  #
  # ---------------------------------------------------------------------------
  # PER-DESTINATION FORWARDING (OTL-25 §2) — which signal goes where.
  # The collector has no "user flag" primitive beyond a pipeline's `exporters:`
  # list, so routing IS that list. To send a signal to a destination, add its
  # exporter id to the pipeline below (and uncomment the env-gated exporter
  # block above + set its env vars). Defaults:
  #
  #   signal   | destination(s)          | change via
  #   ---------|-------------------------|-------------------------
  #   metrics  | prometheus (+ honeycomb) | metrics.exporters list
  #   logs     | otlp_http=Loki (+ honeycomb) | logs.exporters list
  #   traces   | otlp/tempo (+ honeycomb) | traces.exporters list
  #
  # Dash0 REMOVED from all three PUBLIC pipelines 2026-08-01 (OTL-64) — it
  # duplicated Loki/Prometheus/Tempo (paid for the same data twice) with no
  # alerting, tracing workflow, or automation actually built on Dash0 to
  # justify the $41.17/30d. The otlp_http/dash0 block above stays DECLARED
  # (the private overlay's Cloudflare pipelines still use it) — re-enabling
  # here is just appending `otlp_http/dash0` back to a pipeline's exporters.
  #
  # TRACES FAN OUT TO TEMPO + HONEYCOMB — and ONLY because this pipeline is
  # POST-tail_sampling (keep errors + slow>1s + 20% of the rest, already wired
  # below), so the per-span vendor bill is trimmed to the sampled stream rather
  # than the full firehose. RULES that still hold:
  #   * Do NOT add a vendor trace leg to any pipeline that lacks tail_sampling
  #     ahead of it (e.g. never at 100% on a high-volume unsampled pipeline).
  #   * Never point a vendor leg at an empty/env-driven endpoint (crash-loops the
  #     collector at boot) — HONEYCOMB_* must be set in .env first (or DASH0_*
  #     if re-enabling Dash0).
  #   * Loki still cannot ingest traces — never add otlp_http to traces.exporters.
  # ---------------------------------------------------------------------------
  pipelines:
    metrics:
      # OTL-20: the count + signal_to_metrics connectors feed catalyst-derived
      # metrics into this one metrics pipeline (no parallel pipeline — invariant).
      # deltatocumulative converts the count connector's Delta sums to Cumulative;
      # resource/strip_connector_iid drops the connector's per-run instance id.
      receivers: [otlp, count, signal_to_metrics]
      processors: [deltatocumulative, transform/connector_metric_fixup, resource, resource/strip_connector_iid]
      # To fan metrics out to another vendor as well, append the SAME exporter
      # id here, e.g.:
      #
      #   exporters: [prometheus, otlp_http/honeycomb, otlp_http/dash0]
      #
      # (One exporter definition can serve both pipelines.) Dash0 REMOVED
      # 2026-08-01 (OTL-64) — see the forwarding table above.
      # OTL-54: `debug` REMOVED. It serialized every metric record to stdout,
      # and with Docker's json-file driver unrotated that produced a 314 GiB
      # container log (~12.7 GB/day). It is a troubleshooting tool, not a
      # production exporter — re-add it TEMPORARILY when debugging, then take it
      # back out. The exporter block itself stays DEFINED (the private
      # Cloudflare pipelines still reference it).
      exporters: [prometheus, otlp_http/honeycomb]

    logs:
      receivers: [otlp]
      # OTL-20: transform/metrics_normalize runs AFTER transform/logs so the
      # logs->metrics connectors (exporters below) see underscore-form keys.
      # CTL-1731: batch/loki is LAST on purpose — it must see the final record
      # shape, and every exporter/connector on this pipeline benefits from the
      # size bound. Without it a single receive went to Loki whole and was
      # refused for exceeding the 4 MiB gRPC limit; see the processor's comment.
      processors: [resource, transform/logs, transform/metrics_normalize, transform/scheduler_health_promote, transform/updater_promote, batch/loki]
      # otlp_http = Loki (OTL-8 rename). To turn on a vendor fan-out:
      # (1) uncomment the matching exporter block above if not already, (2) set
      # the env vars in docker-compose.yml, and (3) add its exporter id to the
      # list below. Keep otlp_http; add the new ones (do NOT re-add `debug` —
      # OTL-54). Dash0 REMOVED 2026-08-01 (OTL-64) — see the forwarding table
      # above; its exporter block stays declared for the private overlay.
      #
      # OTL-20: count + signal_to_metrics are connector-exporters here — they
      # derive Prometheus metrics from these (post-transform) log records and
      # emit into the metrics pipeline above. They are derivation, not storage,
      # so the payload-parity invariant (identical payload to every STORAGE
      # destination) is unaffected.
      # OTL-54: `debug` REMOVED (see the metrics pipeline above). This was the
      # single largest contributor to the 314 GiB log — every catalyst log
      # record was serialized to stdout on top of being shipped to Loki.
      exporters: [otlp_http, otlp_http/honeycomb, count, signal_to_metrics]

    traces:
      # OTL-25: spans -> Tempo + Honeycomb (Dash0 removed 2026-08-01, OTL-64 —
      # see the forwarding table above). NO transform/logs here — that is a
      # logs-only Loki-shaping step, wrong for traces. `resource` stamps
      # environment=production; `tail_sampling`
      # keeps slow ticks (>1s) + errors and samples the rest, and the vendor legs
      # sit AFTER it so they only bill for the sampled stream. One pipeline per
      # signal (OTL-1). Runs healthy-but-empty until the daemons emit spans.
      receivers: [otlp]
      # OTL-56: filter/drop_crate_internals runs BEFORE tail_sampling on purpose
      # — dropping the h2 firehose first means the sampler's decisions are made
      # over real spans instead of library noise, and it does less work.
      processors: [resource, filter/drop_crate_internals, tail_sampling]
      # OTL-54: `debug` REMOVED (see the metrics pipeline above). Span volume
      # here is dominated by codex-app-server emitting Rust h2 HTTP/2 library
      # internals (one span per frame op) — serializing that to stdout as well
      # was pure waste.
      exporters: [otlp/tempo, otlp_http/honeycomb]
