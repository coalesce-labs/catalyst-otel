receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add resource attributes for better analysis
  resource:
    attributes:
      - key: environment
        value: "production"
        action: insert

  # Copy resource attributes to log record attributes so they appear
  # as Loki structured metadata. Resource attributes from
  # OTEL_RESOURCE_ATTRIBUTES are not automatically promoted by Loki's
  # default config — only log record attributes become structured metadata.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # direnv resource attributes (set via use_otel_context in ~/.config/direnv/lib/otel.sh)
          - set(attributes["project"], resource.attributes["project"])
          - set(attributes["hostname"], resource.attributes["hostname"])
          # Canonical host identity (CTL-812): strip the macOS-appended ".local"
          # so every emitter (catalyst-agent, Claude Code, otel-forward, future
          # hosts) lands under ONE hostname label — a ".local" variant briefly
          # split one machine into two gauge series. Runs for ALL sources here
          # so no emitter can reintroduce the split.
          - replace_pattern(attributes["hostname"], "\\.local$", "")
          - set(attributes["branch"], resource.attributes["branch"])
          - set(attributes["linear_key"], resource.attributes["linear.key"])
          - set(attributes["catalyst_orchestration"], resource.attributes["catalyst.orchestration"])
          # Identity & environment
          - set(attributes["launcher_name"], resource.attributes["launcher.name"])
          - set(attributes["service_namespace"], resource.attributes["service.namespace"])
          - set(attributes["user"], resource.attributes["user"])
          - set(attributes["resource_environment"], resource.attributes["environment"])
          # Session context
          - set(attributes["working_directory"], resource.attributes["working.directory"])
          - set(attributes["github_pr"], resource.attributes["github.pr"])
          # Catalyst orchestrator/worker context
          - set(attributes["catalyst_role"], resource.attributes["catalyst.role"])
          - set(attributes["catalyst_orchestrator"], resource.attributes["catalyst.orchestrator"])
          # CTL-760 session.context per-event attributes (OTL-2).
          # These are LOG RECORD attributes (numeric), not resource attributes — source is
          # attributes[...], not resource.attributes[...]. Rename dot-form -> underscore-form so
          # LogQL pipeline filters and `unwrap` use the standard naming convention.
          - set(attributes["claude_ratelimit_five_hour_pct"], attributes["claude.ratelimit.five_hour_pct"])
          - set(attributes["claude_ratelimit_seven_day_pct"], attributes["claude.ratelimit.seven_day_pct"])
          - set(attributes["claude_context_used_pct"], attributes["claude.context.used_pct"])
          - set(attributes["claude_turn"], attributes["claude.turn"])
          # Catalyst execution-model phase and context labels (OTL-3)
          - set(attributes["task_type"], resource.attributes["task.type"])
          - set(attributes["catalyst_exec_context"], resource.attributes["catalyst.exec_context"])
          # Catalyst dispatch-mode label (OTL-7): WHO dispatched the phase —
          # execution-core (daemon) vs orchestrate (/orchestrate wave). Emitted by
          # phase-agent-dispatch only when CATALYST_DISPATCH_MODE is set, so this
          # set() is a no-op (error_mode: ignore) until the catalyst emit side ships.
          - set(attributes["catalyst_dispatch_mode"], resource.attributes["catalyst.dispatch_mode"])
          # Account-level rate-limit usage (CTL-787): account.ratelimit.sampled event
          # (service.name=catalyst.execution-core) carries 5h/7d subscription usage % labeled by
          # account email. LOG-RECORD attributes (numeric/string) -> source is attributes[...],
          # not resource.attributes[...]. Rename dot->underscore for LogQL unwrap/labels. No-op
          # (error_mode: ignore) until the emit side ships.
          - set(attributes["account_email"], attributes["account.email"])
          - set(attributes["ratelimit_five_hour_pct"], attributes["ratelimit.five_hour_pct"])
          - set(attributes["ratelimit_seven_day_pct"], attributes["ratelimit.seven_day_pct"])
          - set(attributes["ratelimit_five_hour_resets_at"], attributes["ratelimit.five_hour_resets_at"])
          - set(attributes["ratelimit_seven_day_resets_at"], attributes["ratelimit.seven_day_resets_at"])
          - set(attributes["ratelimit_seven_day_opus_pct"], attributes["ratelimit.seven_day_opus_pct"])
          - set(attributes["ratelimit_seven_day_sonnet_pct"], attributes["ratelimit.seven_day_sonnet_pct"])
          - set(attributes["subscription_type"], attributes["subscription.type"])
          - set(attributes["rate_limit_tier"], attributes["rate_limit.tier"])
          # Standalone-host + multi-account agent telemetry (CTL-812): the new
          # catalyst.agent service emits per-host, per-process, and rate-limit
          # pace LOG-RECORD attributes. Same dot->underscore rename convention
          # for LogQL labels/unwrap. Source is attributes[...] (numeric/string),
          # not resource.attributes[...]. No-op (error_mode: ignore) until the
          # catalyst.agent emit side ships.
          # -- rate-limit pace (extends the CTL-787 account block) --
          - set(attributes["ratelimit_five_hour_pace"], attributes["ratelimit.five_hour_pace"])
          - set(attributes["ratelimit_seven_day_pace"], attributes["ratelimit.seven_day_pace"])
          # -- host metrics --
          - set(attributes["host_cpu_pct"], attributes["host.cpu_pct"])
          - set(attributes["host_cpu_count"], attributes["host.cpu_count"])
          - set(attributes["host_load1"], attributes["host.load1"])
          - set(attributes["host_mem_used_mb"], attributes["host.mem_used_mb"])
          - set(attributes["host_mem_total_mb"], attributes["host.mem_total_mb"])
          - set(attributes["host_mem_used_pct"], attributes["host.mem_used_pct"])
          - set(attributes["host_disk_used_gb"], attributes["host.disk_used_gb"])
          - set(attributes["host_disk_total_gb"], attributes["host.disk_total_gb"])
          - set(attributes["host_disk_used_pct"], attributes["host.disk_used_pct"])
          # -- per-process metrics --
          - set(attributes["process_command"], attributes["process.command"])
          - set(attributes["process_cpu_pct"], attributes["process.cpu_pct"])
          - set(attributes["process_rss_mb"], attributes["process.rss_mb"])
          - set(attributes["process_ticket"], attributes["process.ticket"])
          - set(attributes["process_phase"], attributes["process.phase"])

  # OTL-20: normalize the CLASS B catalyst attribute keys the logs->metrics
  # connectors group/read by. Loki sanitizes dot->underscore on ingest, so the
  # underscore names seen in Loki are ambiguous about the in-collector form;
  # catalyst's emit convention (<namespace>.<field>, see transform/logs above)
  # implies these arrive DOT-form. Each guarded copy creates the underscore key
  # from the dot source when present; if the emitter is already underscore-native
  # the `where dot != nil` guard is false and it is a no-op. Correct either way.
  # (CLASS A fields — host.*/process.*/ratelimit.* — already get underscore
  # copies from transform/logs above, so they are NOT repeated here.) The
  # connectors consume the logs pipeline AFTER this processor.
  transform/metrics_normalize:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # event decomposition (low-card enums + the routing key event_name)
          - set(attributes["event_entity"], attributes["event.entity"]) where attributes["event.entity"] != nil
          - set(attributes["event_action"], attributes["event.action"]) where attributes["event.action"] != nil
          - set(attributes["event_name"], attributes["event.name"]) where attributes["event.name"] != nil
          # host.name is a RESOURCE attribute on catalyst events (clean short form:
          # mini, mini-2), NOT a log attribute. Every derived metric labels by
          # host_name, so without this copy EVERY datapoint is dropped for a
          # missing grouping key. Source it from the resource, not the log record.
          - set(attributes["host_name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
          # catalyst emits catalyst.ticket.type (all dots), not catalyst.ticket_type.
          - set(attributes["catalyst_ticket_type"], attributes["catalyst.ticket.type"]) where attributes["catalyst.ticket.type"] != nil
          # recovery decision/board-scan enums + invariant gauge
          - set(attributes["recovery_decision"], attributes["recovery.decision"]) where attributes["recovery.decision"] != nil
          - set(attributes["recovery_fix_class"], attributes["recovery.fix_class"]) where attributes["recovery.fix_class"] != nil
          - set(attributes["recovery_mode"], attributes["recovery.mode"]) where attributes["recovery.mode"] != nil
          - set(attributes["recovery_gate_decision"], attributes["recovery.gate_decision"]) where attributes["recovery.gate_decision"] != nil
          - set(attributes["recovery_invariants_failed"], attributes["recovery.invariants_failed"]) where attributes["recovery.invariants_failed"] != nil
          # scheduler gauges (autotune-gauge + parallelism-sampled events)
          - set(attributes["scheduler_load1"], attributes["scheduler.load1"]) where attributes["scheduler.load1"] != nil
          - set(attributes["scheduler_load_per_core"], attributes["scheduler.load_per_core"]) where attributes["scheduler.load_per_core"] != nil
          - set(attributes["scheduler_max_parallel_target"], attributes["scheduler.max_parallel_target"]) where attributes["scheduler.max_parallel_target"] != nil
          - set(attributes["scheduler_max_parallel_effective"], attributes["scheduler.max_parallel_effective"]) where attributes["scheduler.max_parallel_effective"] != nil
          - set(attributes["scheduler_max_parallel_current"], attributes["scheduler.max_parallel_current"]) where attributes["scheduler.max_parallel_current"] != nil
          - set(attributes["scheduler_running_workers"], attributes["scheduler.running_workers"]) where attributes["scheduler.running_workers"] != nil
          - set(attributes["scheduler_bg_count"], attributes["scheduler.bg_count"]) where attributes["scheduler.bg_count"] != nil
          - set(attributes["scheduler_mem_free_pct"], attributes["scheduler.mem_free_pct"]) where attributes["scheduler.mem_free_pct"] != nil
          # host gauges not already renamed by transform/logs (underscore-native suspected)
          - set(attributes["host_disk_avail_gb"], attributes["host.disk_avail_gb"]) where attributes["host.disk_avail_gb"] != nil
          - set(attributes["host_disk_free_pct"], attributes["host.disk_free_pct"]) where attributes["host.disk_free_pct"] != nil

  # OTL-31: Tier-1 daemon scheduler-health logs (service_name=catalyst.execution-core,
  # CTL-1330/1332 full-pino-body) carry their fields ONLY in the JSON body string.
  transform/scheduler_health_promote:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - 'resource.attributes["service.name"] == "catalyst.execution-core" and IsMatch(body, "^\\{")'
        statements:
          - merge_maps(cache, ParseJSON(body), "upsert")
          - set(attributes["host_name"], cache["host_name"]) where cache["host_name"] != nil
          - replace_pattern(attributes["host_name"], "\\..*$", "")

          - set(attributes["sched_tick_total_ms"], cache["total_ms"]) where cache["total_ms"] != nil
          - set(attributes["sched_free_slots"], cache["free_slots"]) where cache["free_slots"] != nil
          - set(attributes["sched_eligible_count"], cache["eligible_count"]) where cache["eligible_count"] != nil
          - set(attributes["sched_liveness_fresh"], cache["liveness_fresh"]) where cache["liveness_fresh"] != nil
          - set(attributes["sched_is_tick"], "1") where cache["total_ms"] != nil

          - set(attributes["pass_eligible_read_ms"], cache["pass_durations"]["eligible-read"]) where cache["pass_durations"] != nil
          - set(attributes["pass_phantom_sweep_ms"], cache["pass_durations"]["phantom-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_watchdog_ms"], cache["pass_durations"]["watchdog"]) where cache["pass_durations"] != nil
          - set(attributes["pass_cost_cap_ms"], cache["pass_durations"]["cost-cap"]) where cache["pass_durations"] != nil
          - set(attributes["pass_stall_janitor_ms"], cache["pass_durations"]["stall-janitor"]) where cache["pass_durations"] != nil
          - set(attributes["pass_unstuck_sweep_ms"], cache["pass_durations"]["unstuck-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_recovery_pass_ms"], cache["pass_durations"]["recovery-pass"]) where cache["pass_durations"] != nil
          - set(attributes["pass_liveness_read_ms"], cache["pass_durations"]["liveness-read"]) where cache["pass_durations"] != nil
          - set(attributes["pass_board_health_ms"], cache["pass_durations"]["board-health"]) where cache["pass_durations"] != nil
          - set(attributes["pass_preemption_sweep_ms"], cache["pass_durations"]["preemption-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_advancement_ms"], cache["pass_durations"]["advancement"]) where cache["pass_durations"] != nil
          - set(attributes["pass_new_work_pull_ms"], cache["pass_durations"]["new-work-pull"]) where cache["pass_durations"] != nil
          - set(attributes["pass_terminal_sweep_ms"], cache["pass_durations"]["terminal-sweep"]) where cache["pass_durations"] != nil
          - set(attributes["pass_cooldown_gc_ms"], cache["pass_durations"]["cooldown-gc"]) where cache["pass_durations"] != nil
          - set(attributes["pass_reclaim_ms"], cache["pass_durations"]["reclaim"]) where cache["pass_durations"] != nil

          - set(attributes["event_loop_p50_ms"], cache["event_loop_p50_ms"]) where cache["event_loop_p50_ms"] != nil
          - set(attributes["event_loop_p99_ms"], cache["event_loop_p99_ms"]) where cache["event_loop_p99_ms"] != nil
          - set(attributes["event_loop_max_ms"], cache["event_loop_max_ms"]) where cache["event_loop_max_ms"] != nil
          - set(attributes["sched_is_event_loop"], "1") where cache["event_loop_p99_ms"] != nil

          - set(attributes["liveness_outcome"], cache["outcome"]) where cache["outcome"] != nil
          - set(attributes["sched_is_liveness"], "1") where cache["outcome"] != nil

  # OTL-20: the count connector emits Delta-temporality sums; Prometheus needs
  # Cumulative. Passes already-cumulative metrics (claude_code_* OTLP) through
  # unchanged, so it is safe on the shared metrics pipeline.
  deltatocumulative: {}

  # OTL-20: the connectors set host_name as a metric ATTRIBUTE (controlled
  # low-card label). But the prometheus exporter's resource_to_telemetry_conversion
  # ALSO turns the RESOURCE attribute host.name into a host_name label -> a
  # duplicate-label collision that makes the exporter silently drop the ENTIRE
  # connector metric (symptom: zero catalyst_* series on :8889 while claude_code_*
  # still export fine). Delete resource host.name on connector-scoped metrics so
  # only the connector's own host_name attribute survives. claude_code metrics
  # (different scope) keep resource host.name -> host_name exactly as before.
  transform/connector_metric_fixup:
    error_mode: ignore
    metric_statements:
      - context: metric
        conditions:
          - 'IsMatch(instrumentation_scope.name, "connector")'
        statements:
          - delete_key(resource.attributes, "host.name")

  # OTL-20: the signal_to_metrics connector stamps a per-run
  # signal_to_metrics.service.instance.id onto its output resource, which
  # resource_to_telemetry_conversion would turn into a churny label that changes
  # on every collector restart. Drop it (no-op for metrics that lack it).
  resource/strip_connector_iid:
    attributes:
      - key: signal_to_metrics.service.instance.id
        action: delete

  # OTL-25: traces tail sampling. Keeps every span that matters — slow ticks
  # (the event-loop-blocking wedge signal) and errors — and probabilistically
  # samples the rest so trace volume stays bounded once the daemons emit spans
  # (producer side = CTL-1330). tail_sampling buffers each trace until
  # decision_wait, then ORs the policies: a trace is kept if ANY policy matches.
  # We run a single collector instance, so all spans of a trace arrive here and
  # the decision is complete. Inert until traces actually flow.
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-ticks
        type: latency
        latency:
          threshold_ms: 1000
      - name: sample-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 20

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    # Keep this only modestly longer than the agent emit interval (~5m). A short
    # window means a stale series shape (e.g. an old commit/version label-set
    # after a deploy, or an offline host) stops being re-published within
    # minutes instead of lingering for hours — which is what made the same host
    # appear as multiple "ghost" series across panels (CTL-1235 follow-up).
    metric_expiration: 15m
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: normal

  # Loki OTLP/HTTP exporter. Renamed otlphttp -> otlp_http (OTL-8): the bare
  # "otlphttp" alias is deprecated in otelcol-contrib v0.149.0 and logs a
  # startup deprecation warning ("\"otlphttp\" alias is deprecated; use
  # \"otlp_http\" instead"). The canonical factory id is otlp_http.
  otlp_http:
    endpoint: http://otel-loki:3100/otlp

  # ---------------------------------------------------------------------------
  # Fan-out exporters (CTL-812 / OTL-1). ENABLED 2026-06-07 — env vars live in
  # /home/rozich/otel-stack/.env (gitignored). To DISABLE a destination,
  # re-comment its block AND remove it from the pipeline exporters lists
  # below. The OTel Collector validates EVERY declared
  # exporter at startup (not only the ones in a pipeline), and the otlphttp
  # factory rejects an empty endpoint — so leaving otlp_http/dash0 declared
  # with endpoint: ${env:DASH0_OTLP_ENDPOINT} would crash-loop the collector
  # with "at least one endpoint must be specified" until DASH0_OTLP_ENDPOINT
  # is set. To enable fan-out: (1) uncomment the destination block(s) below,
  # (2) set the matching env vars (see docker-compose.yml otel-collector
  # environment passthrough), and (3) uncomment the "enable fan-out" line under
  # service.pipelines.logs.exporters. As-is, the collector boots with ZERO env
  # vars set.
  #
  # PAYLOAD-PARITY INVARIANT (OTL-1 — the architectural rule of this file):
  # this collector runs processing/transforms (resource, transform/logs)
  # BEFORE storage, so a new destination is added ONLY by appending its
  # exporter to the exporters list of the EXISTING pipeline — NEVER by
  # creating a parallel per-vendor pipeline (e.g. logs/honeycomb). A parallel
  # pipeline lets the processor chains drift apart and the destinations
  # silently fall out of sync: every destination must receive the IDENTICAL
  # post-transform payload. Per-exporter FORMAT settings (e.g. prometheus
  # resource_to_telemetry_conversion) are fine — destination-specific
  # post-PROCESSING is not. validate-dashboard.sh enforces the
  # one-pipeline-per-signal rule.
  # ---------------------------------------------------------------------------

  # Honeycomb (logs). Endpoint is the standard ingest URL. The dataset header
  # is required for non-tracing signals (logs/metrics); for traces Honeycomb
  # routes by service.name and the dataset header is ignored.
  otlp_http/honeycomb:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
      x-honeycomb-dataset: ${env:HONEYCOMB_DATASET}

  # Dash0 (logs). Endpoint and bearer token both come from env.
  otlp_http/dash0:
    endpoint: ${env:DASH0_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:DASH0_AUTH_TOKEN}

  # OTL-25: Tempo (traces). STATIC endpoint — never env-driven. A declared
  # exporter with an empty endpoint crash-loops the collector at boot (the
  # reason the env-gated otlp_http/dash0 leg stays commented out of its pipeline
  # when DASH0_* is unset). Tempo is in-cluster so plaintext gRPC with
  # tls.insecure is correct; we reach it at the container name on otel-network.
  otlp/tempo:
    endpoint: otel-tempo:4317
    tls:
      insecure: true

# ---------------------------------------------------------------------------
# OTL-20: derive Prometheus metrics from catalyst log events (logs->metrics).
# High-volume catalyst signals (event occurrences, scheduler/host gauges,
# decisions, rate-limit usage) live ONLY as Loki log lines today; aggregating
# them means count_over_time at dashboard load — expensive, and it trips Loki's
# max_query_series=500 cap on the high-card event_name family. These connectors
# turn them into cheap, uncapped, alertable Prometheus series.
#
# CARDINALITY RULE (hard): labels are ONLY low-card enums — event_entity,
# event_action, host_name, recovery_*, catalyst_ticket_type, rate_limit_tier.
# NEVER event_name / event_label / session.id / linear_key / ticket / branch /
# account_email (PII) / process_command (dirty). Spend & tokens are already
# native Prometheus counters (claude_code_*); not duplicated here.
#
# Wiring (respects the OTL-1 one-pipeline-per-signal invariant): the connectors
# are EXPORTERS on the existing logs pipeline (consumed AFTER transform/logs +
# transform/metrics_normalize, so every key is underscore form) and RECEIVERS on
# the existing metrics pipeline (-> prometheus + fan-out). deltatocumulative on
# the metrics pipeline converts the count connector's Delta sums to Cumulative.
# ---------------------------------------------------------------------------
connectors:
  # Occurrence / decision counters (Delta sums -> deltatocumulative -> Prometheus).
  # NOTE: do NOT set `error_mode: ignore` on these connectors — in otelcol 0.154.0
  # it suppresses ALL metric output (produces zero series). Verified empirically:
  # default error_mode already drops bad datapoints gracefully (a non-numeric /
  # empty / missing field returns HTTP 200, not a 5xx back to the sender), so the
  # shared logs batch is never failed. Leave error_mode at its default.
  count:
    logs:
      catalyst_event_total:
        description: "Catalyst events by entity/action/host (replaces Loki count_over_time; uncapped)"
        conditions:
          - 'attributes["event_entity"] != nil'
        attributes:
          - key: event_entity
          - key: event_action
          - key: host_name
      catalyst_dispatch_total:
        description: "Phase-dispatch outcomes (requested/launched/failed/runaway/enqueued). Hero = rate(action=launched); per-TICKET suffix kept OUT of labels."
        conditions:
          - 'IsMatch(attributes["event_name"], "^phase.dispatch.")'
        attributes:
          - key: event_action
          - key: reason
          - key: catalyst_ticket_type
          - key: host_name
      catalyst_recovery_decision_total:
        description: "Recovery-controller fix/escalate decisions by fix_class and mode"
        conditions:
          - 'attributes["event_name"] == "recovery.decision"'
        attributes:
          - key: recovery_decision
          - key: recovery_fix_class
          - key: recovery_mode
          - key: host_name
      catalyst_recovery_board_scan_total:
        description: "Recovery board-scan gate verdicts (proceed/skip) by mode"
        conditions:
          - 'attributes["event_name"] == "recovery.board-scan"'
        attributes:
          - key: recovery_gate_decision
          - key: recovery_mode
          - key: host_name
      catalyst_liveness_refresh_total:
        description: "Liveness-refresh outcomes (resolved/timeout/error). rate(outcome=timeout)>0 = wedge alarm"
        conditions:
          - 'attributes["sched_is_liveness"] == "1"'
        attributes:
          - key: liveness_outcome
          - key: host_name

  # Numeric gauges from event fields. Values are strings in transit -> Double() cast.
  # Do NOT set `error_mode: ignore` here — in otelcol 0.154.0 it suppresses ALL
  # gauge output. The default already handles a bad Double() cast safely: the
  # offending datapoint is dropped and the log batch still returns HTTP 200
  # (verified against missing / empty / non-numeric field values), so a malformed
  # sample can't 5xx the shared logs ingestion path.
  signal_to_metrics:
    logs:
      # --- scheduler autotune-gauge (phase.scheduler.autotune-gauge.<orchestration>) ---
      - name: catalyst_scheduler_load1
        description: "Scheduler 1-min load average"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_load1"])'
      - name: catalyst_scheduler_load_per_core
        description: "Scheduler load normalized by core count"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_load_per_core"])'
      - name: catalyst_scheduler_max_parallel_target
        description: "Autotuner target parallel-slot count"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_max_parallel_target"])'
      - name: catalyst_scheduler_max_parallel_effective
        description: "Effective (applied) parallel-slot count after autotune clamp"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_max_parallel_effective"])'
      - name: catalyst_scheduler_running_workers
        description: "Concurrent running workers at sample time"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_running_workers"])'
      - name: catalyst_scheduler_mem_free_pct
        description: "Scheduler view of free memory percent"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.autotune-gauge")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_mem_free_pct"])'
      # --- scheduler parallelism-sampled (phase.scheduler.parallelism-sampled.<orchestration>) ---
      - name: catalyst_scheduler_max_parallel_current
        description: "Current max-parallel observed at sample time"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.parallelism-sampled")']
        attributes:
          - key: host_name
        gauge:
          value: 'Double(attributes["scheduler_max_parallel_current"])'
      - name: catalyst_scheduler_bg_count
        description: "Background/queued job count at sample time"
        conditions: ['IsMatch(attributes["event_name"], "^phase.scheduler.parallelism-sampled")']
        attributes:
          - key: host_name
        gauge:
