global:
  scrape_interval: 15s

# OTL: canonical cross-provider AI recording rules (ai:tokens:sum /
# ai:tool_calls:sum / ai:cost_usd:sum). Mounted as a directory (not a single
# file) per the "single-file bind mounts go stale after git pull" gotcha in
# .agents/skills/otel-stack-ops/SKILL.md. New rule files require
# `docker compose restart otel-prometheus` (or `make restart`) -- this
# directive alone does not take effect until the container is recreated.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Application telemetry the collector RE-EXPORTS (claude_code_*, catalyst_*).
  # This is the prometheus EXPORTER's endpoint — not the collector's own health.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # OTL-55: the collector's OWN internal metrics (otelcol_*) — queue depth,
  # enqueue/send failures, refused/dropped records. A DIFFERENT port and a
  # DIFFERENT concern from :8889 above; conflating the two is what let the
  # collector run unmonitored for weeks. Requires the service::telemetry block
  # in collector-config.yaml (which must bind 0.0.0.0, not the default
  # localhost, to be reachable from this container).
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888'] 