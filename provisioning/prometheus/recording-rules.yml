groups:
  # ---------------------------------------------------------------------
  # OTL: canonical cross-provider AI usage metrics (Ryan-directed, 2026-08-24,
  # extended 2026-08-24 with account/phase once the relay dispatcher started
  # stamping them on both feeds).
  #
  # Goal: one label schema across the Claude Code feed (claude_code_*, native
  # SDK-exported metrics with full resource-attribute promotion) and the Codex
  # feed (codex_*, native metrics from BOTH codex_exec headless relay workers
  # and Codex_Desktop/codex-app-server), rolled up to provider/model/account/
  # project/ticket/phase/token_type/cost.
  #
  # EVIDENCE (verified live against the otel-stack Prometheus, see the OTL PR
  # description for the full attribute-validation table):
  #   - claude_code_token_usage_tokens_total / claude_code_cost_usage_USD_total
  #     (native) carry model, type (token_type), project, branch, linear_key,
  #     task_type, catalyst_orchestration, host_name, account, phase,
  #     user_email/user_account_id -- FULL ticket + account attribution -- for
  #     any session where the launcher's OTEL_RESOURCE_ATTRIBUTES survived
  #     (12496/22220 series over 7d carried linear_key; the launcher-trap gap
  #     documented in otel-dashboards SKILL.md/CLAUDE_OBSERVABILITY.md still
  #     applies to the rest). `account` here is the fleet's per-rotation slot
  #     (e.g. "acct6"), confirmed live 2026-08-24 -- the earlier gap ("only
  #     user_email exists and is constant") is now closed; `phase` (e.g.
  #     "implement", "validate") is also confirmed live.
  #   - claude_code_tool_result_total (collector `count` connector, OTL-21)
  #     ALSO carries project/branch/linear_key/task_type/account/phase live
  #     today -- resource_to_telemetry_conversion promotes them same as the
  #     native metrics. This CONTRADICTS the connector's own inline comment in
  #     collector-config.yaml ("CANNOT be sliced by project/branch/host") --
  #     that comment is stale docs, not current behavior; flagged separately,
  #     not corrected here (out of this PR's scope). It does NOT carry `model`.
  #   - codex_tool_call_total / codex_thread_started_total /
  #     codex_turn_ttft_duration_ms_* / codex_turn_ttfm_duration_ms_* are
  #     native codex_exec (headless relay) metrics that DO carry model,
  #     project, branch, linear_key, task_type, host_name (host_name="laptop"),
  #     account (e.g. "codex-641648d1", the ChatGPT account_id from
  #     ~/.codex/auth.json), and phase -- all confirmed live 2026-08-24.
  #   - codex_turn_token_usage_sum / codex_conversation_turn_count_total /
  #     codex_turn_e2e_duration_ms_* are Codex_Desktop / codex-app-server ONLY
  #     -- codex_exec never emits them (0 series, confirmed via
  #     `codex_conversation_turn_count_total{exported_job="codex_exec"}` and
  #     `codex_turn_token_usage_sum{exported_job="codex_exec"}`). Headless
  #     relay token volume by ticket exists ONLY in Loki (codex.sse_event
  #     unwrap; see dashboards/codex-usage.json "Codex — Relay Attribution"
  #     row and the new "Estimated Cost" row) -- there is no Prometheus source
  #     for the ai:tokens:sum openai leg to carry ticket/project dims, and
  #     therefore no way to compute a Prometheus-native ai:cost_usd:sum openai
  #     leg either. See the OTL PR gap list (OTL-78 tracks a
  #     logs-to-metrics connector to close this).
  #   - Codex has NO real cost/credit telemetry anywhere: not in the OTLP feed
  #     (grepped every structured-metadata key on codex_exec streams -- no
  #     cost/dollar/usd/price/credit/balance/spend field exists), not in the
  #     local ~/.codex/sessions/**/rollout-*.jsonl rate_limits.credits block
  #     (has_credits:false, balance:"0", plan_type:"pro" on every session
  #     checked), and the OpenAI platform Costs API is not even reachable from
  #     this environment (~/.codex/auth.json has an empty OPENAI_API_KEY --
  #     auth_mode is "chatgpt", i.e. ChatGPT Plan Pro subscription, no API key
  #     configured at all). ai:cost_usd:sum therefore has NO real openai leg
  #     -- do not invent one. An ESTIMATED-at-API-list-price figure exists as
  #     Loki-only dashboard panels (never a recording rule under this metric
  #     name, to keep "real" and "estimated" impossible to blend by accident)
  #     -- see dashboards/codex-usage.json and dashboards/ai-usage.json, and
  #     provisioning/prometheus/codex-price-table.md for the cited source.
  #
  # These rules RENAME/RELABEL already-native, already-scraped series into a
  # shared name+label schema -- they do not introduce new label cardinality
  # (unlike a NEW collector connector, which is the OTL-20/21 "keep ticket
  # labels off connector metrics" cardinality rule; that rule does not apply
  # here because we are not creating a new high-card series, we are grouping
  # existing ones).
  # ---------------------------------------------------------------------
  - name: ai-canonical-tokens
    interval: 1m
    rules:
      # provider=anthropic: native claude_code_* token counter. `type` is
      # Claude's native label spelling; canonical dim is `token_type`.
      #
      # OTL-81: excludes model=~"^glm.*" -- GLM rides this SAME metric family
      # (same OTel exporter, same Claude Code binary) but is a distinct
      # provider lane split out below. IMPORTANT, verified live 2026-08-24:
      # GLM series carry NO `account` label at all (checked
      # `count by (account) (claude_code_token_usage_tokens_total)` --  only
      # `account="acct6"` appears, GLM sessions have the label entirely
      # absent). The ticket's/PR-brief's assumption that GLM is identified by
      # `account="glm-coding"` is WRONG on this stack -- `model` is the only
      # reliable discriminator (`glm-5.3[1m]`, `glm-5.2[1m]`, `glm-5.2`, ...).
      #
      # OTL-93: also excludes model=~"^qwen.*" -- since ~2026-08-27 the Qwen
      # relay lanes run through the claude-code SDK harness (model
      # `qwen3.8-max`; the SDK warns `unrecognized_model` but telemetry
      # flows), so Qwen rides this same family too (verified live
      # 2026-08-28: `qwen3.8-max[1m]`, account="qwen-token-plan"). Without
      # the exclusion Qwen tokens silently inflate the Claude lane.
      - record: ai:tokens:sum
        labels:
          provider: anthropic
        expr: |
          label_replace(
            sum by (model, type, project, branch, linear_key, task_type, catalyst_orchestration, account, phase) (
              claude_code_token_usage_tokens_total{model!~"^(glm|qwen).*"}
            ),
            "token_type", "$1", "type", "(.*)"
          )

      # provider=glm: same metric family as anthropic (Claude Code's own
      # exporter), filtered to model=~"^glm.*". Token COUNTS here are
      # accurate as reported -- only the $ price (ai:cost_usd:sum below) is
      # wrong for this lane, which is why tokens and cost are split
      # differently (tokens: raw counter is fine; cost: needs re-rating).
      - record: ai:tokens:sum
        labels:
          provider: glm
        expr: |
          label_replace(
            sum by (model, type, project, branch, linear_key, task_type, catalyst_orchestration, account, phase) (
              claude_code_token_usage_tokens_total{model=~"^glm.*"}
            ),
            "token_type", "$1", "type", "(.*)"
          )

      # provider=openai: Codex_Desktop/app-server ONLY (see header note --
      # codex_exec emits no token-usage metric at all). No project/branch/
      # linear_key/task_type/account/phase on this leg -- GAP, see PR
      # description (headless-by-ticket tokens live in Loki instead).
      - record: ai:tokens:sum
        labels:
          provider: openai
        expr: |
          sum by (model, token_type) (codex_turn_token_usage_sum)

      # provider=qwen: LIVE since OTL-93 (2026-08-28). The original OTL-81
      # placeholder read `qwen_token_usage_tokens_total`, anticipating a
      # dedicated OpenCode/Qwen exporter -- that family never materialized
      # (still zero `qwen_*`/`opencode_*` series, checked live 2026-08-28).
      # What actually happened: since ~2026-08-27 the Qwen relay lanes run
      # through the claude-code SDK harness (model `qwen3.8-max`; the SDK
      # warns `unrecognized_model` but telemetry flows), so Qwen rides the
      # SAME claude_code_* family as anthropic/glm, discriminated by `model`
      # (live: `qwen3.8-max[1m]`, account="qwen-token-plan"). Same shape as
      # the glm leg above; the anthropic leg excludes ^qwen.* to match.
      # Token COUNTS are accurate as reported; the $ cost counter for this
      # lane is Anthropic-rate fiction (Qwen bills in plan credits -- see
      # the ai-qwen-credits-estimate group below), so there is deliberately
      # NO provider=qwen leg under ai:cost_usd:sum.
      - record: ai:tokens:sum
        labels:
          provider: qwen
        expr: |
          label_replace(
            sum by (model, type, project, branch, linear_key, task_type, catalyst_orchestration, account, phase) (
              claude_code_token_usage_tokens_total{model=~"^qwen.*"}
            ),
            "token_type", "$1", "type", "(.*)"
          )

  - name: ai-canonical-tool-calls
    interval: 1m
    rules:
      # provider=anthropic: OTL-21 count-connector metric. No `model` label
      # available on this connector metric (see header note).
      - record: ai:tool_calls:sum
        labels:
          provider: anthropic
        expr: |
          sum by (tool_name, success, project, branch, linear_key, task_type, catalyst_orchestration, account, phase) (
            claude_code_tool_result_total
          )

      # provider=openai: native codex_exec metric -- full ticket dims. `tool`
      # is Codex's native label spelling; canonical dim is `tool_name`.
      - record: ai:tool_calls:sum
        labels:
          provider: openai
        expr: |
          label_replace(
            sum by (tool, success, model, project, branch, linear_key, task_type, host_name, account, phase) (
              codex_tool_call_total
            ),
            "tool_name", "$1", "tool", "(.*)"
          )

  - name: ai-canonical-cost
    interval: 1m
    rules:
      # provider=anthropic ONLY -- REAL dollars, native cost counter. No
      # openai leg here on purpose: Codex has no real cost telemetry (see
      # header note) and this metric name is reserved for REAL dollars only,
      # so a consumer can trust `ai:cost_usd:sum` without checking a flag.
      # Codex's ESTIMATED-at-list-price figure lives only in dashboard
      # panels (Loki-sourced, labeled "estimated" in every title), never
      # under this recording-rule name.
      #
      # OTL-81: excludes model=~"^glm.*" -- see the ai:tokens:sum note above
      # on why `model`, not `account="glm-coding"`, is the correct GLM
      # discriminator on this stack.
      #
      # OTL-93: also excludes model=~"^qwen.*" for the same reason GLM is
      # excluded -- since the 2026-08-27 SDK-harness cutover Qwen sessions
      # emit claude_code_cost_usage_USD_total priced from Claude Code's own
      # Anthropic-protocol cost table (measured $40.90 of fictional dollars
      # in 24h, 2026-08-28), which is NOT a real charge (Qwen bills in plan
      # credits). Letting it through would contaminate the REAL-dollars
      # contract this metric name promises. Qwen's trustworthy figure is
      # the credits estimate (ai-qwen-credits-estimate group below); there
      # is deliberately no provider=qwen cost leg.
      - record: ai:cost_usd:sum
        labels:
          provider: anthropic
        expr: |
          sum by (model, project, branch, linear_key, task_type, catalyst_orchestration, account, phase) (
            claude_code_cost_usage_USD_total{model!~"^(glm|qwen).*"}
          )

      # provider=glm: RE-RATED, not real, not estimated-at-list-price like
      # Codex -- a third category. Claude Code's native
      # claude_code_cost_usage_USD_total prices every session (GLM included)
      # from its own Anthropic-protocol cost table; for a GLM session that
      # number is measured (OTL-80) ~2.8x the true metered-equivalent price
      # (~2.3x reproduced live against this recording rule's own 7d window,
      # 2026-08-24: $48.54 raw vs $20.92 rerated). This leg recomputes cost
      # from GLM's own token counts at GLM's AUTHORITATIVE first-party rates
      # (docs.z.ai/guides/overview/pricing, fetched 2026-08-24) instead of
      # trusting the native counter: GLM-5.3 = $1.40/M input, $0.26/M
      # cached-input, $4.40/M output, NO separate cache-write fee (writes
      # bill at the input rate, unlike Anthropic's 1.25x write premium).
      # Applied uniformly to every model=~"^glm.*" series (5.3-only rate --
      # 5-turbo/4.7 price differently per OTL-80's table; splitting by
      # `model` is a follow-up once that matters for this fleet's mix). Like
      # Codex's estimate, this is a list/metered-price PROXY, not a real
      # charge -- GLM also runs on a flat $18/mo coding-plan subscription
      # with no true per-token bill -- but it is the trustworthy per-lane
      # figure for cost-comparison panels, unlike the raw native counter for
      # this account, which must never be surfaced as GLM spend.
      - record: ai:cost_usd:sum
        labels:
          provider: glm
        expr: |
          sum by (model, project, branch, linear_key, task_type, catalyst_orchestration, account, phase) (
            (claude_code_token_usage_tokens_total{model=~"^glm.*", type=~"input|cacheCreation"} * 1.40 / 1e6)
            or
            (claude_code_token_usage_tokens_total{model=~"^glm.*", type="cacheRead"} * 0.26 / 1e6)
            or
            (claude_code_token_usage_tokens_total{model=~"^glm.*", type="output"} * 4.40 / 1e6)
          )

  # ---------------------------------------------------------------------
  # OTL Task C (Ryan-directed, 2026-08-24): subscription efficiency --
  # "how many retail-priced dollars of work does each subscription window
  # deliver, and which models burn subscription limit fastest per dollar."
  #
  # NUMERATOR: retail-$ equivalent of work performed. Verified 2026-08-24
  # (cross-checked a real session: claude_code_cost_usage_USD_total for a
  # claude-sonnet-5 session with 151,040 input / 17,732,657 cacheCreation /
  # 772,691,591 cacheRead / 1,694,674 output tokens reported $229.56;
  # tokens x Anthropic's published API list price for claude-sonnet-5
  # ($2/$2.50(5m-write)/$0.20(cache-read)/$10 per MTok, from
  # platform.claude.com/docs/en/about-claude/pricing, fetched 2026-08-24)
  # computes to $216.12 -- within ~6% (the residual is explained by tool-use
  # system-prompt token overhead, mixed 5m/1h cache-write durations, etc.,
  # not by a different pricing basis). ai:cost_usd:sum (provider=anthropic)
  # is therefore the RETAIL-EQUIVALENT of work performed, NOT this laptop's
  # actual subscription cost -- this account authenticates via a Claude
  # subscription seat (acct1..6 rotation), which has no per-token bill.
  # Codex's numerator is the Task A estimated-cost series (same list-price
  # basis, see provisioning/prometheus/codex-price-table.md) -- Loki-only,
  # so it is NOT a Prometheus recording rule leg here; see
  # dashboards/ai-usage.json's Subscription Efficiency row for the Codex
  # side (computed the same way as the Codex Usage dashboard's cost row).
  #
  # DENOMINATOR: subscription-limit-consumed, a gauge that neither provider
  # exports as OTLP on its own -- ai_subscription_limit_used_percent (see
  # collector-config.yaml's signal_to_metrics rule of the same name), fed by
  # scripts/ai-subscription-limit-scraper.sh. Proven live end-to-end
  # 2026-08-24 (13 real samples, laptop -> collector -> Loki) -- the
  # Prometheus GAUGE conversion below additionally needs the collector
  # config deployed (restart), same as every other collector-config.yaml
  # change in this repo.
  #
  # HONESTY (Ryan's explicit requirement -- read before using these panels):
  #   - This is a DIRECTIONAL ratio, not a bill. Anthropic/OpenAI's internal
  #     limit-charging weights are opaque (cache discounts, per-model
  #     multipliers on the LIMIT side are not published the way token PRICES
  #     are) -- a model that looks "cheap per limit-%" here might be
  #     internally weighted differently against the actual quota.
  #   - The `[5h]`/`[7d]` lookback is a ROLLING window, not necessarily
  #     aligned to the account's actual reset boundary (`resets_at`, present
  #     on every ai_subscription_limit_used_percent sample as
  #     `resets_at` -- not joinable into a PromQL rule, since Prometheus
  #     range durations must be literal; a dashboard viewing a specific
  #     account should cross-check `resets_at` against "now" and discount
  #     the ratio near/just-after a reset, when used_percent is low but the
  #     rolling $ window still includes PRE-reset spend).
  #   - `retail_usd_per_limit_pct` is dollars per ONE percentage point of the
  #     window consumed; multiply by 100 for "retail-$ if the window were
  #     fully consumed at the observed rate" ("retail-$ per full window").
  # ---------------------------------------------------------------------
  - name: ai-canonical-efficiency
    interval: 1m
    rules:
      - record: ai:efficiency:retail_usd_per_limit_pct
        labels:
          window: 5h
        expr: |
          sum by (provider, account) (max_over_time(ai:cost_usd:sum{provider="anthropic"}[5h]))
          / on (provider, account) group_left
            ai_subscription_limit_used_percent{provider="anthropic", window="5h"}

      - record: ai:efficiency:retail_usd_per_limit_pct
        labels:
          window: 7d
        expr: |
          sum by (provider, account) (max_over_time(ai:cost_usd:sum{provider="anthropic"}[7d]))
          / on (provider, account) group_left
            ai_subscription_limit_used_percent{provider="anthropic", window="7d"}

      - record: ai:efficiency:retail_usd_per_limit_pct_by_model
        labels:
          window: 5h
        expr: |
          sum by (provider, account, model) (max_over_time(ai:cost_usd:sum{provider="anthropic"}[5h]))
          / on (provider, account) group_left
            ai_subscription_limit_used_percent{provider="anthropic", window="5h"}

      - record: ai:efficiency:retail_usd_per_limit_pct_by_model
        labels:
          window: 7d
        expr: |
          sum by (provider, account, model) (max_over_time(ai:cost_usd:sum{provider="anthropic"}[7d]))
          / on (provider, account) group_left
            ai_subscription_limit_used_percent{provider="anthropic", window="7d"}

  # ---------------------------------------------------------------------
  # OTL Task E (wired 2026-08-24): relay-phase COMPLETIONS, the denominator
  # for "$ per COMPLETED phase" -- distinct from the phase RUN counts on
  # dashboards/ai-usage.json's "Phase Throughput & Unit Economics" row
  # (session/conversation-started counts, which include failed/re-dispatched
  # runs). ai_phase_completion_total is the new count-connector metric in
  # collector-config.yaml, fed by ~/catalyst/comms/coord/relay-phase-event.sh
  # (the coordinator, once per verified relay report). First real event
  # verified live 2026-08-24 (linear_key=CTC-970... wait CTC-977, phase=
  # research, provider=openai, outcome=done, service_name=relay-coordinator).
  # Same recording pattern as ai:tool_calls:sum above (bare cumulative sum,
  # no increase()/rate() at record time) -- downstream panels apply
  # max_over_time(...[$__range]) per the OTL-75 per-session-counter
  # convention, kept consistent even though this is an occurrence counter
  # rather than a per-session gauge-like counter, so every ai:* series in
  # this file is queried the same way regardless of its underlying shape.
  - name: ai-canonical-phase-completions
    interval: 1m
    rules:
      - record: ai:phase_completions:sum
        expr: |
          sum by (phase, provider, model, outcome, account) (ai_phase_completion_total)

  # ---------------------------------------------------------------------
  # OTL-82 recording-rules round / OTL-83 (Ryan-directed, 2026-08-25): a
  # genuinely monotonic, forward-latching accumulator for
  # claude_code_token_usage_tokens_total and claude_code_cost_usage_USD_total
  # -- built to close two gaps the query-time-only fixes in this PR's earlier
  # commits (r2-r4) could not close on their own:
  #
  #   (a) The "per Interval" bucket-delta panels' legend Total needs to equal
  #       the stat tiles' sum(max_over_time(counter[$__range])) figure. The
  #       previous construction (OTL-82-r4: clamp_min(this bucket's
  #       max_over_time - previous bucket's max_over_time, 0), both terms
  #       independently re-evaluated against the RAW per-session counter at
  #       query time) measured tokens within ~3-4% and cost within ~6-13%,
  #       depending on bucket width and live fleet churn -- see the r4 panel
  #       descriptions for the numbers. That error came from re-deriving each
  #       term independently from a volatile, staleness-prone raw counter on
  #       every dashboard query; two independent query-time evaluations of
  #       (nearly) the same window over churning per-session series don't
  #       agree exactly. Subtracting ONE exact, pre-computed, already-
  #       monotonic series from itself (accum(t) - accum(t - $__interval)) is
  #       a straightforward telescoping identity with no reconciliation
  #       error: sum(all bucket deltas across a range) = accum(end) -
  #       accum(start - $__interval) by construction, not by measurement.
  #   (b) OTL-83: the OTL-82-r3/current "Cumulative" row (panels 261-264)
  #       anchors to the dashboard's own start via `@ ${__from:date:seconds}`
  #       (closes Codex's original P1 finding -- no more pre-loaded first
  #       point), and matches the true window total exactly at the FINAL
  #       point -- but the curve can still dip mid-chart: `max_over_time(raw
  #       counter[$__range])` is a MOVING window that slides forward with
  #       each rendered timestamp t, so a session that ages past its 15m
  #       expiry (OTL-75) relative to t can silently drop out of that specific
  #       t's window even though it was captured at an earlier t. No amount of
  #       query-time window tuning against the raw counter can close this --
  #       OTL-83's own "Fix shape" note calls for "a backend recording rule
  #       that accumulates per-session peaks forward permanently (state
  #       carried outside the query window)". That's what this group is.
  #
  # MECHANISM (v1, OTL-82/83, 2026-08-24 -- SUPERSEDED, kept here because
  # the failure mode is the whole reason v2 below looks the way it does):
  # the original shipped construction was
  #   current = sum by (dims) (max_over_time(raw_counter[20m]))
  #   prior   = max_over_time(this_same_rule_name[20m])
  #   this_rule := max by (dims) (prior or current)
  # This IS genuinely monotonic non-decreasing (each tick can only take the
  # max of what it already had and what it just saw) -- but monotonic
  # non-decreasing is not the same property as "correctly tracks new
  # increases", and this construction only has the first one. `current` is
  # a SNAPSHOT of concurrently-visible cumulative totals, not a delta: it
  # legitimately shrinks whenever fewer sessions are contributing to a dims
  # combo than at some earlier peak (sessions retiring, concurrency
  # dropping), and `max(prior, current)` then keeps the larger, stale
  # `prior` forever -- frozen until FRESH activity independently
  # re-exceeds the ENTIRE historical peak for that exact dims combo, which
  # for a linear_key that saw one big concurrent burst can be hours away.
  #
  # OTL-87 (Ryan-directed, found live 2026-08-25 ~12:10): this is exactly
  # what flatlined the 13 accum-consuming panels to ~0 during the day's
  # busiest hours -- `ai:tokens_accum:sum - (... offset 1h)` read 0.0 for
  # every one of 108 live per-ticket series while 5-6 worker lanes actively
  # burned tokens below an earlier overnight peak. Confirmed structurally
  # (this is the only self-referential group in the file; every other
  # `ai:*` rule reads raw counters directly and is unaffected) and
  # reproduced deterministically in `recording-rules.test.yml` (a
  # 3-session burst-then-quiet fixture: the v1 expression above plateaus at
  # the t=10m peak forever while a real, growing session accrues
  # underneath it -- see that file's header for why `promtool test rules`
  # can't validate the *self-referential* combinator end-to-end, only its
  # two decomposed, fully-testable pieces below).
  #
  # MECHANISM (v2, OTL-87, 2026-08-25): a true delta-accumulator --
  # `accum(t) = accum(t-1m) + Σ(real per-session increases since t-1m)` --
  # split into two rules per metric so the combinator logic isn't
  # duplicated three times inside one `expr:`:
  #
  #   1. `ai:tokens_accum_delta:sum` / `ai:cost_usd_accum_delta:sum`: the
  #      per-dims sum of real per-session increases since the previous
  #      evaluation, computed at the RAW SESSION level (session_id still
  #      present) before the `sum by (dims)` aggregation collapses it away
  #      -- computing the delta AFTER aggregating to dims would reintroduce
  #      the exact same concurrency-snapshot problem one level up. Per raw
  #      session series: `clamp_min(max_over_time(raw[20m]) -
  #      max_over_time(raw[20m] offset 1m), 0) or (max_over_time(raw[20m])
  #      unless max_over_time(raw[20m] offset 1m))`. The two `or`-joined
  #      branches are a disjoint, no-double-count partition: the
  #      subtraction covers sessions with both a current and a 1m-ago
  #      sample (clamp_min absorbs a same-session_id counter reset --
  #      OTL-75's documented ~15m-idle-then-resume-at-a-lower-value
  #      behavior -- as a one-tick 0 instead of a negative subtraction);
  #      `unless` covers sessions with no 1m-ago sample (brand new, or
  #      reappeared after >20m absence) and credits their full current
  #      value, matching this file's established "first sample counts in
  #      full" convention. Recovery from a same-session_id reset is
  #      bounded but not instant: `max_over_time(...[20m])` keeps the
  #      PRE-reset peak visible on both sides of the subtraction until it
  #      ages out of the 20-minute window OR the resumed ramp organically
  #      re-exceeds it (whichever comes first) -- a self-healing,
  #      bounded-by-the-reset's-own-size undercount, never a double-count,
  #      and never dependent on any OTHER session's peak the way v1 was.
  #   2. `ai:tokens_accum:sum` / `ai:cost_usd_accum:sum`: forward-latch the
  #      delta onto the prior recorded total --
  #      `(max_over_time(self[20m]) + delta) or max_over_time(self[20m])
  #      or delta`. The `(A+B) or A or B` shape is required, not
  #      stylistic: a bare `prior + delta` inner-joins and silently DROPS
  #      any dims combo missing from either side (a quiet ticket has no
  #      delta this tick; a brand-new ticket has no prior yet) -- which
  #      would erase accumulated totals on every quiet tick, a worse bug
  #      than the one being fixed. The 20-minute self-lookback (unchanged
  #      from v1) is still what makes the accumulator survive Prometheus
  #      eval gaps, same reasoning as v1's prior/current windows.
  #
  # FLAWED-WINDOW DECISION (OTL-87 -- no separate "OTL-85 runbook" doc
  # exists anywhere in this repo for this kind of decision; recorded here
  # instead, per this file's own established convention of documenting
  # these decisions inline): the v1
  # rule was live 2026-08-24 ~08:54 through this fix's deploy, and
  # permanently under-recorded every dims combo whose concurrency dropped
  # below an earlier local peak during that window. Because v2 is also
  # self-referential (required to survive session expiry), deploying it
  # does not retroactively correct that window's stored samples -- v2
  # picks up `prior` from whatever v1 last wrote and computes correct
  # deltas forward from there, permanently under-counting by the v1
  # shortfall unless backfilled. Recommendation: re-run an OTL-85-style
  # `promtool` block-backfill for 2026-08-24 ~08:54 through deploy against
  # the v2 expression (raw per-session counters for that same-day window
  # should still be within Prometheus retention) -- not merely annotate
  # it. Left for the coordinator to execute (per dispatch note), since it
  # requires the live Prometheus TSDB this worktree has no access to.
  #
  # OTL-88 (Ryan-directed, found live 2026-08-25 ~139M-token/$102 spike):
  # closes two DIFFERENT mechanisms, both traced to the same "20-minute
  # self-lookback" idea above being exact only across BACK-TO-BACK 1-minute
  # evaluations:
  #
  #   1. THE TICKET'S NAMED BUG (this file): `ai:tokens_accum_delta:sum` /
  #      `ai:cost_usd_accum_delta:sum` compute each tick's contribution as
  #      raw(t) - raw(t) offset 1m -- exact when the rule group's own
  #      evaluation cadence keeps up with the raw counter's continuous
  #      scrape cadence, but silently captures only the FINAL 60 SECONDS of
  #      growth whenever the rule group's own ticks fall behind (a "slow
  #      rule group": Prometheus keeps scraping normally, only this group's
  #      own evaluation lags). Fix: a second, 20-minute-offset delta
  #      (`ai:tokens_accum_delta_20m:sum` / `ai:cost_usd_accum_delta_20m:sum`
  #      above) computed directly from raw counters, exact regardless of how
  #      many intermediate ticks fired, combined with the existing 1-minute
  #      fast path via an element-wise max (`(A > B) or B or (A unless B)`,
  #      proven standalone against stub metrics in
  #      `tests/recording-rules.test.yml` Group D, since promtool cannot
  #      chain the real self-referential candidates -- see that file's own
  #      header). Rejected alternative: widening the EXISTING 1-minute
  #      rule's offset in place -- changes its semantics from "growth in the
  #      last tick" to "growth over a trailing N-minute window," forces
  #      rewriting every promtool assertion calibrated to 1-minute
  #      granularity, and introduces a NEW steady-state precision loss (a
  #      same-session_id reset-then-full-recovery cycle completing entirely
  #      inside the wider window nets out at the endpoints and is silently
  #      under-counted -- pinned by `tests/recording-rules.test.yml` Group
  #      C2c -- where today's 1-minute cadence catches it incrementally).
  #      The dual-candidate design changes nothing about the existing rule
  #      (`ai:tokens_accum_delta:sum` / `ai:cost_usd_accum_delta:sum` stay
  #      byte-for-byte unchanged) and only ADDS a corrective path that wins
  #      the max() comparison exactly when the fast path would under-count.
  #
  #   2. THE LIVE-OBSERVED SPIKE (dashboards/unified-dashboard.json, NOT
  #      this file): a structurally identical bug one layer up. The nine
  #      "per Interval" panels (ids 7, 8, 30, 31, 36, 37, 76, 77, 209) do
  #      their own `X - (X offset $__interval or X * 0)` arithmetic
  #      directly against the cumulative `ai:tokens_accum:sum` /
  #      `ai:cost_usd_accum:sum` series. When a Prometheus restart (or any
  #      other gap in THIS RULE'S OWN recorded-sample history, independent
  #      of mechanism 1 above) leaves a gap wider than the panel's implicit
  #      staleness lookback around the `offset $__interval` point, the
  #      `or (X * 0)` fallback -- correct for a genuinely brand-new dims
  #      combo -- fires for an old, continuously-existing series instead,
  #      and the panel attributes that series' ENTIRE historical cumulative
  #      total to one bucket. This is the mechanism that actually produced
  #      the 139M-token/$102 spike Ryan observed 2026-08-25, reproduced live
  #      twice, including once on a restart (OTL-89/PR #185) that touched
  #      ZERO lines of this file. Fix: each panel's `offset $__interval`
  #      lookup widened to `max_over_time(X[20m] offset $__interval)`,
  #      tolerating up to 20 minutes of gap in `ai:tokens_accum:sum`'s own
  #      sample history around that point, while the `or (X * 0)`
  #      bootstrap-for-genuinely-new-series fallback is otherwise untouched.
  #      Fixing mechanism 1 alone does NOT close this -- a Prometheus
  #      restart that touches no rule-file lines can still gap this file's
  #      OWN output, which is exactly what the panel layer reads.
  #
  #   CORRECTED FLAWED-WINDOW DATE: this ticket's research found the v1
  #   rule's actual birth epoch (`1787664852`, from OTL-85's ticket
  #   description) is 2026-08-25 13:34:12 UTC (~08:34 CDT) -- a full day
  #   LATER than the "2026-08-24 ~08:54" prose both PR #182's description
  #   and the FLAWED-WINDOW DECISION note directly above this one currently
  #   state. Whoever runs the eventual backfill should target 2026-08-25,
  #   not 2026-08-24.
  #
  #   THIS FIX'S OWN TRANSITION WINDOW: any Prometheus restart between the
  #   OTL-87/PR #182 deploy and this fix's own deploy inherits the SAME
  #   gap-loss/panel-spike exposure this ticket closes -- the eventual
  #   backfill's end boundary should be "this fix's deploy," matching the
  #   existing convention above, not left ambiguous.
  #
  # DIMS: the union of every label the 13 native-counter "per Interval" /
  # "Cumulative" dashboard panels this round converts group by (host_name /
  # hostname -- alternate, mutually-exclusive spellings already reconciled
  # downstream by the same label_replace("display", ...) pattern those panels
  # used before this change; model; type; project; branch; linear_key;
  # task_type; account; phase). Same label set already present on the raw
  # counters -- this renames/re-aggregates already-native series, same as
  # every other rule in this file; it does not introduce new label
  # cardinality (see the ai:tokens:sum header note above).
  #
  # OUT OF SCOPE for this conversion (left on the raw counters, unconverted,
  # deliberately): "Spend per Interval by Type" (id 210) and "Spend by Model
  # x Token Type" (id 212) do a WEIGHTED ALLOCATION of native per-model cost
  # across token-type proportions (input=1, output=5, cacheRead=.1,
  # cacheCreation=2) -- a synthetic split, not a straight per-series
  # accumulation, and scripts/validate-dashboard.sh's OTL-71 assertions
  # literally grep those two panels' exprs for the raw counter names and the
  # weight multipliers; converting them is a separate, riskier change than
  # this round's scope. "Pull Requests per Interval" / "Commits per Interval"
  # (id 90/91) are a different metric family (GitHub events) entirely, not
  # token/cost counters. "Model Mix (Cost/Tokens)" piecharts (id 12/13) and
  # the "Tokens/Spend by Model x Token Type" tables (id 211/212) are
  # unaffected -- left on their existing $__range-windowed raw-counter
  # queries.
  # ---------------------------------------------------------------------
  - name: ai-canonical-running-total
    interval: 1m
    rules:
      # Per-dims sum of REAL per-session increases since the previous
      # evaluation (1m ago) -- a plain delta, computed at the RAW SESSION
      # level (session_id still present) before aggregating to dims, so a
      # concurrency change (sessions starting/ending) never looks like a
      # change in the total's rate of growth. `clamp_min(..., 0)` absorbs
      # OTL-75's documented same-session_id collector-expiry-then-resume-
      # at-a-lower-value case as a one-tick 0 instead of a negative
      # subtraction (a bounded, one-tick undercount -- never a double-
      # count); `unless` credits a genuinely new (or >20m-absent) session's
      # first sample in full, matching every other ai:* rule's "first
      # sample counts" convention (see the ai:tokens:sum header note).
      - record: ai:tokens_accum_delta:sum
        expr: |
          sum by (host_name, hostname, model, type, project, branch, linear_key, task_type, account, phase) (
            clamp_min(
              max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m])
              - max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m] offset 1m)
              , 0
            )
            or
            (
              max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m])
              unless max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m] offset 1m)
            )
          )

      - record: ai:cost_usd_accum_delta:sum
        expr: |
          sum by (host_name, hostname, model, project, branch, linear_key, task_type, account, phase) (
            clamp_min(
              max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m])
              - max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m] offset 1m)
              , 0
            )
            or
            (
              max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m])
              unless max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m] offset 1m)
            )
          )

      # OTL-88: gap-safe companion to ai:tokens_accum_delta:sum above. Identical per-session
      # clamp_min/unless partition, offset widened from 1m to 20m (reusing this group's existing
      # session-staleness-smoothing constant). At eval_time T this is an exact function of raw
      # counter data in (T-20m-20m, T] -- growth over the last 20 minutes, computed directly from
      # raw counters, independent of how many (if any) intermediate rule-group ticks fired. Used
      # ONLY as a corrective candidate in the max-combination below -- it does not replace
      # ai:tokens_accum_delta:sum, which stays the primary path for steady-state precision (see
      # this file's OTL-88 header note for why: widening the primary rule's window in place would
      # mask an interior same-session_id reset-then-recovery cycle that a 1-minute cadence catches
      # incrementally; a 20-minute-wide comparison only sees the endpoints).
      - record: ai:tokens_accum_delta_20m:sum
        expr: |
          sum by (host_name, hostname, model, type, project, branch, linear_key, task_type, account, phase) (
            clamp_min(
              max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m])
              - max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m] offset 20m)
              , 0
            )
            or
            (
              max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m])
              unless max_over_time(claude_code_token_usage_tokens_total{job="otel-collector"}[20m] offset 20m)
            )
          )

      - record: ai:cost_usd_accum_delta_20m:sum
        expr: |
          sum by (host_name, hostname, model, project, branch, linear_key, task_type, account, phase) (
            clamp_min(
              max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m])
              - max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m] offset 20m)
              , 0
            )
            or
            (
              max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m])
              unless max_over_time(claude_code_cost_usage_USD_total{job="otel-collector"}[20m] offset 20m)
            )
          )

      # OTL-88: fast path, byte-for-byte the same expression OTL-87 shipped -- exact for
      # steady-state (back-to-back 1-minute evaluations), proven by the unchanged Group A/B tests.
      # Renamed to an internal-only metric name (not consumed by any dashboard -- confirmed by
      # grep) because the dashboard-facing name below is now the max-combination, not this rule
      # directly.
      - record: ai:tokens_accum_fast:sum
        expr: |
          (max_over_time(ai:tokens_accum:sum[20m]) + ai:tokens_accum_delta:sum)
          or max_over_time(ai:tokens_accum:sum[20m])
          or ai:tokens_accum_delta:sum

      # OTL-88: gap-safe path, same forward-latch shape, anchored 20 minutes back (offset 20m on
      # both the self-reference AND the delta it adds -- prior and delta MUST share the same
      # anchor point or the arithmetic double-counts or gaps). Correct regardless of how many (if
      # any) intermediate ticks fired between t-20m and t, since ai:tokens_accum_delta_20m:sum is
      # computed directly from raw counters over that span, not from this rule's own tick history.
      - record: ai:tokens_accum_20m:sum
        expr: |
          (max_over_time(ai:tokens_accum:sum[20m] offset 20m) + ai:tokens_accum_delta_20m:sum)
          or max_over_time(ai:tokens_accum:sum[20m] offset 20m)
          or ai:tokens_accum_delta_20m:sum

      # OTL-88: the dashboard-exposed total -- element-wise max of the two candidates above (see
      # Group D for the combinator's own proof). In steady state both candidates converge to the
      # same correct value and the fast path's finer precision is preserved (max of two equal
      # values). During a gap the fast path under-counts (this ticket's bug) while the gap-safe
      # path directly recovers the true total from raw counters -- max() picks the larger,
      # correct one. Never regresses below whatever was already latched, same guarantee as OTL-87.
      - record: ai:tokens_accum:sum
        expr: |
          (ai:tokens_accum_fast:sum > ai:tokens_accum_20m:sum)
          or ai:tokens_accum_20m:sum
          or (ai:tokens_accum_fast:sum unless ai:tokens_accum_20m:sum)

      # OTL-88: cost mirror of the fast/20m/max-combination triad above -- see the tokens leg's
      # comments for the full rationale (identical shape, ai:cost_usd_accum_delta:sum /
      # ai:cost_usd_accum_delta_20m:sum in place of the tokens delta rules).
      - record: ai:cost_usd_accum_fast:sum
        expr: |
          (max_over_time(ai:cost_usd_accum:sum[20m]) + ai:cost_usd_accum_delta:sum)
          or max_over_time(ai:cost_usd_accum:sum[20m])
          or ai:cost_usd_accum_delta:sum

      - record: ai:cost_usd_accum_20m:sum
        expr: |
          (max_over_time(ai:cost_usd_accum:sum[20m] offset 20m) + ai:cost_usd_accum_delta_20m:sum)
          or max_over_time(ai:cost_usd_accum:sum[20m] offset 20m)
          or ai:cost_usd_accum_delta_20m:sum

      - record: ai:cost_usd_accum:sum
        expr: |
          (ai:cost_usd_accum_fast:sum > ai:cost_usd_accum_20m:sum)
          or ai:cost_usd_accum_20m:sum
          or (ai:cost_usd_accum_fast:sum unless ai:cost_usd_accum_20m:sum)

  # ---------------------------------------------------------------------
  # OTL-80 Qwen dashboard block (SELF-METERED ESTIMATE, wired 2026-08-25,
  # Ryan-directed): Ryan bought the Qwen Token Plan (Individual, Pro tier --
  # 40,000 credits per rolling 7-day window). Neither Alibaba's `qwencloud`
  # CLI (`usage summary`'s token_plan block returns subscribed:false for
  # Individual plans -- an account-recognition gap, support ticket open),
  # nor the OpenAI-compat endpoint (no quota headers), nor any public REST
  # route exposes remaining credits today (see this ticket's earlier
  # Usage-API-research comment: "Credit formula NOT published (dynamic,
  # hidden consumption items) -- client-side estimation not viable for
  # Qwen" -- true for an EXACT reading, superseded here only in the sense
  # that Ryan has since supplied a worked-example coefficient set good
  # enough for a directional estimate, not a real metered number).
  # Decision (Ryan, 2026-08-25): ship the cheapest self-metered PROXY now
  # from our own emitted telemetry; swap to the real source
  # (`qwencloud usage summary`'s token_plan fields) the instant Alibaba
  # fixes Individual-plan recognition -- do not wait on that fix to ship
  # visibility.
  #
  # THIS IS AN ESTIMATE, NOT A METERED READING -- same honesty bar as the
  # GLM re-rated-cost leg above (ai:cost_usd:sum{provider="glm"}), except
  # Qwen's coefficients are NOT a vendor-published rate card the way
  # GLM's z.ai pricing page is: they are Ryan's own worked-example numbers
  # for the qwen3.6-plus model tier (2026-08-25), PER-MODEL and
  # UNPUBLISHED by Alibaba -- do not assume they generalize to other Qwen
  # model tiers without a fresh worked example, and do not let this number
  # be read as a bill. Every panel built on this series must say so in its
  # own title/description -- a consumer must not have to trace back to
  # this comment to learn the number is synthetic.
  #
  # COEFFICIENTS (credits per 1,000 tokens, qwen3.6-plus, worked example
  # 2026-08-25): input ~0.2, cached (cacheRead) ~0.02, output ~1.2.
  # cacheCreation is folded into the input rate -- Qwen/DashScope, like
  # GLM's z.ai endpoint (see the ai:cost_usd:sum{provider="glm"} note
  # above), is not known to charge a separate cache-write premium; this is
  # an unverified, conservative assumption inherited from the GLM lane, not
  # a Qwen-specific confirmation -- flag it if a real reading later
  # contradicts it.
  #
  # SOURCE: deliberately layered on ai:tokens:sum{provider="qwen"} (the
  # ai-canonical-tokens group above), NOT on a raw metric name directly.
  # That layering paid off exactly as designed: OTL-93 (2026-08-28)
  # repointed the ONE upstream provider=qwen expr at the claude_code_*
  # family (the 2026-08-27 SDK-harness cutover routes Qwen lanes through
  # claude-code with model `qwen3.8-max` -- the anticipated dedicated
  # qwen_*/opencode_* exporter never materialized), and this whole group
  # went from producing nothing to producing real numbers with zero edits
  # here. CAVEAT that came with that cutover: the coefficients below are
  # still the qwen3.6-plus worked example while the lane now runs
  # qwen3.8-max, which may price differently per-model -- the estimate is
  # directional until a real vendor reading (OTL-80) recalibrates it.
  #
  # WINDOW: same max_over_time(...[7d]) convention as the
  # ai-canonical-efficiency group's denominator rules above (both read a
  # raw-counter-shaped cumulative series over a rolling window at query
  # time) -- not the heavier OTL-82/83 ratchet-accumulator pattern, which
  # was purpose-built for short "per-interval bucket" delta panels, a
  # different problem than this block's single rolling-7d total.
  #
  # STATIC PLAN CONSTANTS (config, not code -- update only if the plan
  # itself changes; there is no metric that reports these):
  #   qwen_plan_credits_per_window = 40000  (Individual, Pro tier, 7d window,
  #     confirmed with Ryan 2026-08-25)
  #   qwen_plan_window_reset_at    = 2026-09-01T05:18 local-console-time,
  #     assumed America/Chicago (this fleet's own timezone -- Alibaba's
  #     console timezone is not independently confirmed) = 1788257880 unix
  #     seconds. Windows RE-ANCHOR to the first call after each reset going
  #     forward -- there is no fixed weekday/time to hardcode beyond this
  #     one known boundary. Refresh this constant (or, better, swap the
  #     whole block to the real qwencloud usage-summary resetDate field)
  #     once the CLI recognizes the Individual plan.
  # ---------------------------------------------------------------------
  - name: ai-qwen-credits-estimate
    interval: 1m
    rules:
      - record: ai:qwen_credits_estimate:sum
        labels:
          coefficient_basis: worked_example_2026_08_25_qwen3_6_plus
        expr: |
          sum by (model, project, branch, linear_key, task_type, account, phase) (
            (ai:tokens:sum{provider="qwen", token_type=~"input|cacheCreation"} * 0.2 / 1000)
            or
            (ai:tokens:sum{provider="qwen", token_type="cacheRead"} * 0.02 / 1000)
            or
            (ai:tokens:sum{provider="qwen", token_type="output"} * 1.2 / 1000)
          )

      # Rolling-7d credits total, all dims collapsed to one number -- the
      # plan quota is fleet-wide, not per-ticket/per-model.
      - record: ai:qwen_credits_estimate_7d:sum
        expr: |
          sum(max_over_time(ai:qwen_credits_estimate:sum[7d]))

      # Percent of the static 40,000/7d quota -- see the STATIC PLAN
      # CONSTANTS note above for why 40000 is hardcoded here rather than
      # read from a metric.
      - record: ai:qwen_credits_pct_of_quota:sum
        expr: |
          (ai:qwen_credits_estimate_7d:sum / 40000) * 100

      # Reset-time ANNOTATION only (not a real quota reading) -- see the
      # STATIC PLAN CONSTANTS note above. A constant unix-seconds gauge so
      # a dashboard panel can reference it via PromQL instead of a
      # hardcoded string, should a future round wire up a live countdown.
      - record: ai:qwen_plan_window_reset_at:sum
        expr: vector(1788257880)
