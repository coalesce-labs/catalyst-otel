apiVersion: 1

# Catalyst survivability pager (OTL-15).
#
# IMPORTANT (learned the hard way): Grafana validates contact-point settings at
# STARTUP, and an EMPTY webhook `url` is FATAL — the provisioning module fails
# and Grafana refuses to boot (crash-loop). "safe-if-unset" therefore does NOT
# mean "empty"; it means "always a valid, non-empty URL".
#
# So docker-compose supplies a harmless localhost placeholder default for
# CATALYST_ALERT_WEBHOOK_URL when it is unset. Grafana boots cleanly; a webhook
# POST to the placeholder simply fails at SEND time (connection refused) — a
# silent no-op pager until Ryan sets the real URL in the gitignored
# /home/rozich/otel-stack/.env. Point it at a paging gateway, a PagerDuty
# Events API endpoint, or a Slack incoming webhook.
contactPoints:
  - orgId: 1
    name: catalyst-pager
    receivers:
      - uid: catalyst_pager_webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${CATALYST_ALERT_WEBHOOK_URL}
          httpMethod: POST
