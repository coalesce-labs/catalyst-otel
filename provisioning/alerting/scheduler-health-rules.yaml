apiVersion: 1

# OTL-31 scheduler-health tail alerts read the retired orchestrator's tick and pass
# histograms (catalyst_scheduler_*_duration_seconds, catalyst_liveness_refresh_total), whose
# last series was 2026-08-25. This file now only deletes those rules from Grafana.

# CTC-7104: retired. These rules read metrics with no series since Aug/Sep 2026 that no current
# code emits, so they could never fire. Grafana keeps a provisioned rule whose file entry is
# removed, so each uid is listed here and deleted on the next otel-grafana restart.
deleteRules:
  - orgId: 1
    uid: catalyst_sched_tick_p99_high
  - orgId: 1
    uid: catalyst_sched_recovery_pass_p99_high
  - orgId: 1
    uid: catalyst_sched_phantom_sweep_p99_high
  - orgId: 1
    uid: catalyst_sched_reclaim_p99_regression
  - orgId: 1
    uid: catalyst_sched_liveness_timeout
