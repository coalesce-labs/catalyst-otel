apiVersion: 1

# OTL-38 + CTL-1369 alerts. Grafana-MANAGED, evaluated on the otel-stack host
# against the catalyst.updater (plugin-pull) + catalyst.install (lifecycle)
# signals. Like the OTL-21 TIER-B rules these are the "rare-event" pages that earn
# their keep as alerts; routing falls through to the root catalyst-pager policy
# (VISIBLE-but-silent until a real pager URL is wired, per OTL-37).
#
# DESIGN — presence over absence. Every rule fires on the PRESENCE of a bad signal
# (a failed/slow refresh, a drift/lag event, a failed/rolled-back install), which
# is robust. True "the updater went silent" liveness is fundamentally an absence
# problem (a silent host emits no series), so it is owned by Gatus (active probe)
# + the daemon-liveness check, NOT a count==0 Grafana rule. The one liveness rule
# here is best-effort (catches a recently-alive-then-stopped updater within the
# 15m metric_expiration window) — Gatus is the source of truth.
#
# noDataState/execErrState = OK: a quiet fleet (no refreshes, no installs, updater
# not yet adopted) returns empty/noData and MUST NOT fire. Several metrics are
# INERT until the updater is adopted / install PR2 lands; these rules read empty
# and stay green until then.
groups:
  - orgId: 1
    name: catalyst-updater
    folder: Catalyst Alerts
    interval: 1m
    rules:
      # 3) ★ Drift — the BROKER's detect-only pass found a node whose updater fell
      #    behind/died. This is the robust staleness signal (presence of a drift
      #    event), used in place of a count==0 staleness rule. LogQL (event-only).
      - uid: catalyst_updater_drift
        title: Plugin checkout drift detected (node fell behind)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          team: catalyst
          signal: updater_drift
          severity: warning
        annotations:
          summary: 'plugin.checkout.drift — a node''s plugin checkout fell behind origin/main'
          description: >
            The broker's detect-only pass emitted plugin.checkout.drift in the last
            30m: a node (owner=updater) whose plugin checkout is behind origin/main —
            its updater fell behind or died. Check that node's updater liveness + the
            last successful plugin.checkout.updated.
          __dashboardUid__: catalyst-fleet-updater
          __panelId__: '7'
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              editorMode: code
              queryType: instant
              refId: A
              expr: sum by (host_name) (count_over_time({service_name=~"catalyst.(broker|updater)"} |= "plugin.checkout.drift" [30m]))
          - refId: B
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # 4) ★ Lag — consecutive pull failures crossed the updater's threshold (ERROR
      #    event). Occurrence-only: the consecutive_failures COUNT is in body.payload
      #    (dropped by otel-forward) so we alert on the lag event itself. LogQL.
      - uid: catalyst_updater_lag
        title: Updater pull lag (consecutive failures)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          team: catalyst
          signal: updater_lag
          severity: warning
        annotations:
          summary: 'plugin.checkout.lag — the updater has failed to pull repeatedly'
          description: >
            A plugin.checkout.lag (ERROR) event fired in the last 30m: the updater
            crossed its consecutive-failure threshold and can't pull. Investigate the
            node's git remote / auth / disk and the catalyst.updater log. (The exact
            consecutive_failures count is not yet a metric — see updater channel turn 11.)
          __dashboardUid__: catalyst-fleet-updater
          __panelId__: '9'
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              editorMode: code
              queryType: instant
              refId: A
              expr: sum by (host_name) (count_over_time({service_name=~"catalyst.(broker|updater)"} |= "plugin.checkout.lag" [30m]))
          - refId: B
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

# CTC-7104: retired. These rules read metrics with no series since Aug/Sep 2026 that no current
# code emits, so they could never fire. Grafana keeps a provisioned rule whose file entry is
# removed, so each uid is listed here and deleted on the next otel-grafana restart.
deleteRules:
  - orgId: 1
    uid: catalyst_updater_refresh_failed
  - orgId: 1
    uid: catalyst_updater_refresh_slow
  - orgId: 1
    uid: catalyst_updater_liveness_silent
  - orgId: 1
    uid: catalyst_install_failed
  - orgId: 1
    uid: catalyst_install_rolled_back
  - orgId: 1
    uid: catalyst_install_phase_slow
