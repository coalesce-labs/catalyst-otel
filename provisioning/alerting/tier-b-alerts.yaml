apiVersion: 1

# OTL-21 TIER-B alerts. Grafana-MANAGED, evaluated on the otel-stack host against
# the OTL-20 catalyst_* counters/gauges and the OTL-21 claude_code_* connector
# metrics. These are the "rare-event" signals that deliberately stayed off the
# stat-tile dashboards (sparse counters under-count via increase() on the tiles)
# but EARN their keep as alerts — the half of OTL-21 that is "logs for detail,
# metrics for aggregation + alerting".
#
# Routing: no receiver named -> the root notification policy (catalyst-pager)
# catches them (same as the OTL-31 scheduler-health rules). VISIBLE-but-silent
# until a real pager URL is wired (CATALYST_ALERT_WEBHOOK_URL) — and per OTL-37
# the delivery path will move to a Grafana webhook -> Catalyst Cloud envelope.
#
# noDataState/execErrState = OK: a quiet fleet (no escalations, slots free, no API
# errors) returns empty/noData and MUST NOT fire — these are advisory, and the
# expressions are written so "healthy" = empty vector.
groups:
  - orgId: 1
    name: catalyst-tier-b
    folder: Catalyst Alerts
    interval: 1m
    rules:
      # 3) Claude Code API errors (429/5xx) elevated — rate-limit / provider trouble.
      - uid: claude_code_api_error_rate_high
        title: Claude Code API error rate elevated (>0.2/s)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          team: catalyst
          signal: claude_code_api_errors
          severity: warning
        annotations:
          summary: 'Claude Code API errors (429/5xx) over 0.2/s for 5m'
          description: >
            claude_code_api_error_total is climbing > 0.2 errors/sec for 5m
            (e.g. sustained 429 rate-limit or 5xx). Sessions are degraded /
            backing off. Break down by model + status_code; check the account
            rate-limit scoreboard.
          __dashboardUid__: claude-code-unified
          __panelId__: '33'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              instant: true
              range: false
              refId: A
              expr: sum(rate(claude_code_api_error_total[5m]))
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator:
                    type: gt
                    params: [0.2]

      # 4) OTL-67 Attribution regression guard — fire when the MAJORITY of live
      #   claude_code_* series carry no linear_key (per-ticket attribution lost).
      #   This is the settings.json-pin regression (root cause fixed by
      #   catalyst#3721 in the catalyst repo); this rule makes a re-break visible
      #   in the stack instead of waiting for a human to spot a "No Data" panel.
      #   Presence-over-absence: healthy/idle => numerator empty => empty vector
      #   => noData => OK. Volume floor (>=5 distinct session_id) avoids paging
      #   on a lone interactive session — counting sessions, not the metric's
      #   high-cardinality series (type x model), so one 2-model session cannot
      #   clear the floor on its own. LogQL not needed — native connector counter.
      - uid: claude_code_attribution_missing
        title: Claude Code telemetry attribution missing (majority of RELAY-DISPATCHED series lack linear_key)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          team: catalyst
          signal: claude_code_attribution_missing
          severity: warning
        annotations:
          summary: '>50% of live RELAY-dispatched claude_code_* series carry no linear_key for 15m — per-ticket attribution lost'
          description: >
            The unattributed fraction of live claude_code_token_usage_tokens_total
            series WITH catalyst_orchestration="relay" is above 50% for 15m
            (volume floor >=5 distinct session_id). Rescoped 2026-08-24 (OTL-81
            investigation): interactive/concierge sessions and in-process
            Agent-tool subagents structurally never carry a single ticket's
            linear_key (catalyst_orchestration is absent, not "relay" — they are
            not relay-dispatched and routinely span many tickets), and mixing
            them into the denominator drove this alert's ratio to 40-60%
            overnight on 2026-08-24 even though every relay-dispatched series in
            that window was fully attributed (verified live). This is the OTL-67
            failure mode: SDK-dispatched (relay) workers emitting claude_code_*
            metrics with only host_name/session_id/type and no linear_key/project/
            branch (settings.json OTEL_RESOURCE_ATTRIBUTES pin winning over the
            per-job env). If this fires again, verify the catalyst#3721 fix is
            still deployed on the emitting host; check ~/.claude/settings.json is
            not re-pinning host.name only. See docs/runbook-otl-67-attribution.md.
          __dashboardUid__: claude-code-unified
          __panelId__: '208'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              instant: true
              range: false
              refId: A
              expr: >-
                (
                  count(claude_code_token_usage_tokens_total{catalyst_orchestration="relay", linear_key=""})
                  /
                  scalar(count(claude_code_token_usage_tokens_total{catalyst_orchestration="relay"}) > 0 or vector(1))
                )
                and on()
                (count(count by (session_id) (claude_code_token_usage_tokens_total{catalyst_orchestration="relay"})) >= 5)
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]

# CTC-7104: retired. These rules read metrics with no series since Aug/Sep 2026 that no current
# code emits, so they could never fire. Grafana keeps a provisioned rule whose file entry is
# removed, so each uid is listed here and deleted on the next otel-grafana restart.
deleteRules:
  - orgId: 1
    uid: catalyst_recovery_escalation_burst
  - orgId: 1
    uid: catalyst_scheduler_slot_starvation
