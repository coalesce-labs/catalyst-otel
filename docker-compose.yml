networks:
  otel-network:
    driver: bridge

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest   # ≈ 50 MB
    container_name: otel-collector
    command: ["--config=/etc/otel/collector-config.yaml"]
    # Fan-out exporter secrets (CTL-812). Passed through from the host env with
    # empty defaults so the collector starts cleanly with NO keys set — the
    # otlp_http/honeycomb and otlp_http/dash0 exporters stay COMMENTED OUT in
    # collector-config.yaml (the collector validates every declared exporter at
    # startup, and dash0's empty endpoint would crash-loop it) until you
    # uncomment both the exporter block and the "enable fan-out" line there.
    # Set real values (e.g. in a local .env) to enable.
    environment:
      HONEYCOMB_API_KEY: ${HONEYCOMB_API_KEY:-}
      HONEYCOMB_DATASET: ${HONEYCOMB_DATASET:-}
      DASH0_OTLP_ENDPOINT: ${DASH0_OTLP_ENDPOINT:-}
      DASH0_AUTH_TOKEN: ${DASH0_AUTH_TOKEN:-}
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC in
      - "4318:4318"      # OTLP HTTP  in
      - "8889:8889"      # Prometheus scrape out
    restart: unless-stopped
    networks:
      - otel-network

  otel-prometheus:
    image: prom/prometheus:latest
    container_name: otel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2y
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - otel-prometheus-data:/prometheus
    ports:
      - "9098:9090"
    restart: unless-stopped
    depends_on: [otel-collector]
    networks:
      - otel-network

  otel-loki:
    image: grafana/loki:latest
    container_name: otel-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - otel-loki-data:/loki
    restart: unless-stopped
    networks:
      - otel-network

  otel-grafana:
    image: grafana/grafana-oss:latest
    container_name: otel-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=logsSampleInExplore
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboards/unified-dashboard.json:/var/lib/grafana/dashboards/unified-dashboard.json:ro
    ports:
      - "13001:3000"
    restart: unless-stopped
    depends_on: [otel-prometheus, otel-loki]
    networks:
      - otel-network

volumes:
  otel-prometheus-data:
  otel-loki-data:
