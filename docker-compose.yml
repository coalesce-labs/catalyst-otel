networks:
  otel-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Container log rotation (OTL-54). Docker's json-file driver defaults to NO
# rotation at all — an empty `LogConfig.Config` means the *-json.log file grows
# without bound for the life of the container. Left unset, this stack had
# accumulated ~356 GB of container logs (otel-collector alone: 314 GiB, growing
# ~12.7 GB/day; otel-loki: 17.7 GB), i.e. >50% of the /data volume, none of it
# ever read.
#
# NOTE: json-file rotates by SIZE, not by time — there is no "daily" option.
# max-size x max-file is therefore a hard CEILING per container (700 MB here),
# which is the property that actually matters: the growth is bounded forever.
# How much wall-clock history that buys depends on the service's log rate, so
# the real fix is to not firehose in the first place — see the `debug` exporter
# removal in collector-config.yaml (same ticket).
#
# Anchored so every service gets the same policy and a new service can't silently
# reintroduce the unbounded default. Compose merges `logging` by key, so the
# private docker-compose.override.yml (which does not set it) inherits this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "7"

services:
  otel-collector:
    # PINNED (OTL-20): the logs->metrics pipeline needs the signal_to_metrics
    # connector, which does NOT exist in older builds (e.g. 0.149.0 only has
    # count/sum). A floating :latest silently drifted home to a build without it,
    # so the collector is pinned to a known-good version that ships
    # signal_to_metrics + deltatocumulative. Bump deliberately, not by drift.
    image: otel/opentelemetry-collector-contrib:0.154.0   # ≈ 50 MB
    container_name: otel-collector
    command: ["--config=/etc/otel/collector-config.yaml"]
    # Fan-out exporter secrets (CTL-812). Passed through from the host env with
    # empty defaults so the collector starts cleanly with NO keys set — the
    # otlp_http/honeycomb and otlp_http/dash0 exporters stay COMMENTED OUT in
    # collector-config.yaml (the collector validates every declared exporter at
    # startup, and dash0's empty endpoint would crash-loop it) until you
    # uncomment both the exporter block and the "enable fan-out" line there.
    # Set real values (e.g. in a local .env) to enable.
    environment:
      HONEYCOMB_API_KEY: ${HONEYCOMB_API_KEY:-}
      HONEYCOMB_DATASET: ${HONEYCOMB_DATASET:-}
      DASH0_OTLP_ENDPOINT: ${DASH0_OTLP_ENDPOINT:-}
      DASH0_AUTH_TOKEN: ${DASH0_AUTH_TOKEN:-}
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC in
      - "4318:4318"      # OTLP HTTP  in
      - "8889:8889"      # Prometheus scrape out
    restart: unless-stopped
    logging: *default-logging
    networks:
      - otel-network

  otel-prometheus:
    image: prom/prometheus:latest
    container_name: otel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2y
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - "${OTEL_PROMETHEUS_DATA:-otel-prometheus-data}:/prometheus"
    ports:
      - "9098:9090"
    restart: unless-stopped
    logging: *default-logging
    depends_on: [otel-collector]
    networks:
      - otel-network

  otel-loki:
    image: grafana/loki:latest
    container_name: otel-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - "${OTEL_LOKI_DATA:-otel-loki-data}:/loki"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - otel-network

  # OTL-25: Tempo — distributed-tracing backend (the traces sibling of Loki/Prom).
  # The collector's traces pipeline forwards spans here over OTLP; Grafana reads
  # them back. Runs healthy-but-EMPTY until the daemons emit spans (CTL-1330).
  otel-tempo:
    # PINNED (OTL-25): single-binary Tempo. 2.10.7 = the GitHub releases/latest
    # stable line (the 3.0.x track ships a different config schema). Bump
    # deliberately, not by :latest drift (the OTL-20 lesson). Config boot-tested
    # on a throwaway 2.10.7 container.
    image: grafana/tempo:2.10.7
    container_name: otel-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      # Named volume (NOT a host bind mount): Docker seeds it with the image's
      # /var/tempo ownership (UID 10001), so Tempo's non-root user can write —
      # no `user:` override needed (verified empirically). A host bind mount
      # would be root-owned and crash Tempo with "permission denied".
      - "${OTEL_TEMPO_DATA:-otel-tempo-data}:/var/tempo"
    ports:
      # Publish ONLY the HTTP API / query / health port (3200). Tempo's OTLP
      # receiver (4317/4318) is reached INTERNALLY by the collector at
      # otel-tempo:4317 and must NOT be published — it would collide with the
      # collector's own 4317/4318 host bindings.
      - "3200:3200"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - otel-network

  otel-grafana:
    image: grafana/grafana-oss:latest
    container_name: otel-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=logsSampleInExplore
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # OTL-15 survivability pager webhook. An EMPTY contact-point URL is FATAL
      # at Grafana startup (provisioning fails -> crash-loop), so when the host
      # env var is unset we pass a harmless localhost PLACEHOLDER. Grafana boots
      # cleanly and webhook POSTs just fail at send time (connection refused) —
      # a silent no-op until Ryan sets the real URL in the gitignored
      # /home/rozich/otel-stack/.env (paging gateway / PagerDuty / Slack hook).
      - CATALYST_ALERT_WEBHOOK_URL=${CATALYST_ALERT_WEBHOOK_URL:-http://localhost:1/catalyst-pager-unconfigured}
    volumes:
      # Grafana's own state (grafana.db: annotations, alert state, prefs). Was
      # previously UNMOUNTED -> ephemeral, lost on every container recreate. Now a
      # volume (env-overridable to a host bind path for backup, like the data
      # stores). Provisioned dashboards/datasources/alerts still reload from the
      # read-only mounts below regardless.
      - "${OTEL_GRAFANA_DATA:-otel-grafana-data}:/var/lib/grafana"
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # Mount the DIRECTORY, not the file: git pull replaces files by rename
      # (new inode), and a single-file bind mount stays pinned to the old inode
      # — Grafana then serves stale JSON until the container is recreated
      # (bit us in CTL-812). A directory mount follows renames.
      - ./dashboards:/var/lib/grafana/dashboards:ro
      # OTL-15: mount the alerting provisioning DIRECTORY (not a single file) so
      # git-pull renames are followed (CTL-812). Grafana reads unified-alerting
      # provisioning from /etc/grafana/provisioning/alerting/ at STARTUP ONLY —
      # a container recreate (operator step) is needed to load rule changes.
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "13001:3000"
    restart: unless-stopped
    logging: *default-logging
    depends_on: [otel-prometheus, otel-loki, otel-tempo]
    networks:
      - otel-network

volumes:
  # Default Docker-managed named volumes — used when the OTEL_*_DATA env vars are
  # UNSET (the portable OSS default). On the home deploy these are overridden to
  # host bind mounts under /data/otel-stack-data via .env, so the data is visible
  # on the host filesystem and easy to back up (restic -> Backblaze B2).
  otel-prometheus-data:
  otel-loki-data:
  otel-tempo-data:
  otel-grafana-data:
